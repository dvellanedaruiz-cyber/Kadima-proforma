<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Kadima</title>
<meta name="theme-color" content="#8B0000">
<link rel="manifest" href="panel-manifest.webmanifest">
<link rel="icon" href="pos-icon-192.png">
<link rel="apple-touch-icon" href="pos-icon-192.png">
<style>
:root{--rojo:#8B0000;--rojo2:#b23a3a;--fondo:#f6f4f2;--borde:#e8e3df;--gris:#6b6b6b;--texto:#1f1f1f;--ok:#1e7d3a;--aviso:#b26a00;--mal:#b00020;--tarjeta:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;background:#fff}
.oculto{display:none!important}
.btn{background:var(--rojo);color:#fff;padding:10px 16px;font-weight:600}
.error{color:var(--mal);min-height:18px;margin-top:8px}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:24px;width:100%;max-width:360px}
.login input{width:100%;margin-bottom:10px}
.marca{color:var(--rojo);font-weight:800;font-size:22px;margin:0}.sub{color:var(--gris);margin:4px 0 16px}

.barra{background:var(--rojo);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
.barra b{font-size:17px;letter-spacing:.5px}.barra .esp{flex:1}
.barra button{background:rgba(255,255,255,.16);color:#fff;padding:7px 11px;font-weight:600;font-size:13px}
.filtros{background:#fff;border-bottom:1px solid var(--borde);padding:7px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:48px;z-index:5}
@media (max-width:420px){.filtros{padding:7px 10px}}
.chip{background:var(--fondo);color:var(--gris);padding:6px 11px;font-size:13px;font-weight:600;border-radius:16px}
.chip.activa{background:var(--rojo);color:#fff}
.fila{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
.fila::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:none}
.fila.envuelve{flex-wrap:wrap;overflow:visible;row-gap:6px}
#chips-c{flex:0 1 auto;min-width:0}
@media (max-width:600px){#chips-c{flex:1 1 100%;order:3}.envuelve .switch{margin-left:auto}}
.lbl{font-size:12px;color:var(--gris);font-weight:700;white-space:nowrap}
.fecha{background:#fff;border:1.5px solid var(--rojo);color:var(--rojo);padding:5px 11px;font-size:13px;font-weight:700;border-radius:16px;white-space:nowrap;flex:none}
.tcomp{font-size:12px;color:var(--gris);white-space:nowrap}
.tcomp b{color:#3d6b99}
.switch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--texto);cursor:pointer;white-space:nowrap;user-select:none;margin-left:auto}
.switch input{display:none}
.switch .sl{width:36px;height:20px;border-radius:12px;background:#ccc;position:relative;transition:.2s;flex:none}
.switch .sl::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + .sl{background:var(--rojo)}
.switch input:checked + .sl::after{left:18px}
.aviso{background:#fff3e0;color:var(--aviso);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;font-weight:600}
/* calendario de rango */
.cal-fondo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:60px 10px 10px;overflow:auto}
.cal{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:14px;max-width:100%}
.cal-tit{font-weight:800;color:var(--rojo);font-size:15px}
.cal-paso{font-size:13px;color:var(--gris);margin:2px 0 10px;min-height:18px}
.cal-paso b{color:var(--texto)}
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-nav button{background:var(--fondo);width:34px;height:32px;font-size:18px;font-weight:700;color:var(--rojo)}
.cal-nav select{padding:5px 6px;font-size:13px}
.cal-meses{display:flex;gap:18px}
.cal-mes{width:252px}
.cal-mes h4{margin:0 0 6px;text-align:center;font-size:13px;text-transform:capitalize}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,36px)}
.cal-sem span{font-size:11px;color:var(--gris);text-align:center;padding:3px 0;font-weight:700}
.cal-dias button{height:34px;background:none;border-radius:0;font-size:13px;color:var(--texto);padding:0}
.cal-dias button:hover{background:#f3e3e3}
.cal-dias .hoy{font-weight:800;text-decoration:underline}
.cal-dias .rg{background:#f6dede}
.cal-dias .ini,.cal-dias .fin{background:var(--rojo)!important;color:#fff;font-weight:700}
.cal-dias .ini{border-radius:8px 0 0 8px}.cal-dias .fin{border-radius:0 8px 8px 0}.cal-dias .ini.fin{border-radius:8px}
.cal-dias .fut{color:#bbb}
.cal.comp .rg{background:#dde7f2}.cal.comp .ini,.cal.comp .fin{background:#3d6b99!important}.cal.comp .cal-tit{color:#3d6b99}
.cal-pie{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.cal-pie button{padding:9px 16px;font-weight:700}
.cal-pie .no{background:var(--fondo);color:var(--gris)}
.cal-pie .si{background:var(--rojo);color:#fff}.cal.comp .cal-pie .si{background:#3d6b99}
.cal-pie .si:disabled{opacity:.4;cursor:default}
@media (max-width:600px){.cal-mes:nth-child(2){display:none}.cal-fondo{padding-top:20px}}
.tabs{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--borde);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;padding:11px 13px;font-weight:600;color:var(--gris);border-bottom:3px solid transparent;border-radius:0;white-space:nowrap}
.tabs button.activa{color:var(--rojo);border-bottom-color:var(--rojo)}
main{padding:14px;max-width:1300px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);margin-bottom:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:900px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:420px){main{padding:10px}.grid{gap:9px}}
.kpi{background:var(--tarjeta);border-radius:14px;padding:13px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);min-width:0}
.kpi .t{font-size:12px;color:var(--gris);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;margin-top:3px;color:var(--gris)}
.kpi .d .sube{color:var(--ok);font-weight:700}.kpi .d .baja{color:var(--mal);font-weight:700}
@media (max-width:420px){.kpi .v{font-size:18px}}
.caja{background:var(--tarjeta);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);min-width:0}
.caja h3{margin:0 0 6px;font-size:14px;color:var(--rojo)}
.caja .nota{font-size:12px;color:var(--gris);margin:-2px 0 6px}
.g{width:100%;height:300px}.g.alto{height:380px}.g.bajo{height:230px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:12px;color:var(--gris);padding:7px 6px;border-bottom:1px solid var(--borde)}
.t td{padding:7px 6px;border-bottom:1px solid #f3f0ed}
.t .n{text-align:right;white-space:nowrap}
.scroll{overflow:auto;max-height:420px}
.neg{color:var(--mal);font-weight:700}.pos{color:var(--ok);font-weight:700}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:#eee;color:#555;white-space:nowrap}
.tag.ok{background:#e6f4ea;color:var(--ok)}.tag.av{background:#fff3e0;color:var(--aviso)}.tag.mal{background:#fdeaea;color:var(--mal)}
.vacio{color:var(--gris);text-align:center;padding:30px 10px;font-size:13px}
.cargando{position:fixed;inset:0;background:rgba(246,244,242,.6);display:flex;align-items:center;justify-content:center;z-index:9;font-weight:700;color:var(--rojo)}
.sync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--gris)}
.sync button{background:var(--fondo);color:var(--rojo);padding:7px 12px;font-weight:700;border:1.5px solid var(--rojo)}
.embebido .barra{display:none!important}.embebido .filtros{top:0}
</style>
</head>
<body>

<section id="v-login" class="centro oculto">
  <form class="login" id="f-login">
    <p class="marca">KADIMA</p><p class="sub">Panel de indicadores · iniciar sesión</p>
    <input id="l-email" type="email" placeholder="Correo" value="admin@kadima.pe" required>
    <input id="l-pass" type="password" placeholder="Contraseña" required>
    <button class="btn" style="width:100%">Ingresar</button>
    <div class="error" id="l-error"></div>
  </form>
</section>

<section id="v-app" class="oculto">
  <div class="barra">
    <b>KADIMA · Panel</b><span class="esp"></span>
    <button id="b-recargar" title="Actualizar">⟳ Actualizar</button>
    <button id="b-salir">Salir</button>
  </div>
  <div class="filtros">
    <div class="fila"><button class="fecha" id="b-fecha">📅 <span id="t-fecha"></span></button><div class="fila" id="chips"></div></div>
    <div class="fila envuelve">
      <span class="lbl">Comparar con:</span><div class="fila" id="chips-c"></div><span class="tcomp" id="t-comp"></span>
      <label class="switch" title="Calcula la venta neta como si todo se hubiera emitido con boleta o factura (total ÷ 1.18), incluidas las notas de venta"><input type="checkbox" id="sw-igv"><span class="sl"></span>Todo con IGV 18%</label>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</section>
<div class="cargando oculto" id="cargando">Cargando…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<!-- gráficos: primero la copia en el mismo sitio, si falta usa los CDN -->
<script src="echarts.min.js"></script>
<script>if (!window.echarts) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"><\/script>');</script>
<script>if (!window.echarts) document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"><\/script>');</script>
<script>
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
// sesión propia del panel: no se mezcla con la de caja/almacén en el mismo navegador
// dentro de "Kadima Gestión" usa la sesión de Gestión (no se mezcla con la caja)
const EMBEBIDO = window.self !== window.top;
if (EMBEBIDO) document.documentElement.classList.add('embebido');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: EMBEBIDO ? 'kadima-gestion-auth' : 'kadima-panel-auth' } });
// correos que pueden entrar al panel
const PERMITIDOS = ['admin@kadima.pe'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const num = n => Number(n || 0);
const S = n => 'S/ ' + num(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const S0 = n => 'S/ ' + num(n).toLocaleString('es-PE', { maximumFractionDigits: 0 });
const P = n => (n === null || n === undefined || !isFinite(n)) ? '—' : num(n).toLocaleString('es-PE', { maximumFractionDigits: 1 }) + '%';
const LIMA = { timeZone: 'America/Lima' };
const iso = d => d.toLocaleDateString('en-CA', LIMA);
const hoy = () => iso(new Date());
const masDias = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fh = t => t ? new Date(t).toLocaleString('es-PE', { ...LIMA, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const fCorta = s => { const [y, m, d] = s.split('-'); return `${d}/${m}`; };
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fMes = s => { const [y, m] = s.split('-'); return `${MES[+m - 1]} ${y.slice(2)}`; };
const DIAS = ['', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const COL = ['#8B0000', '#d2691e', '#e0a458', '#5b8e7d', '#3d6b99', '#8e6bb0', '#c45a7a', '#7a7a7a', '#b8a24a', '#4aa3a3'];
const guardar = (k, v) => { try { localStorage.setItem('kpanel_' + k, JSON.stringify(v)); } catch (e) {} };
const leer = k => { try { return JSON.parse(localStorage.getItem('kpanel_' + k)); } catch (e) { return null; } };

const st = { tab: leer('tab') || 'resumen', rango: leer('rango') || 'mes', desde: leer('desde'), hasta: leer('hasta'), d: null,
             igv18: !!leer('igv18'), comp: leer('comp') || 'no', cDesde: leer('cdesde'), cHasta: leer('chasta'), c: null };
const graficos = [];

function vista(id) { ['v-login', 'v-app'].forEach(v => $(v).classList.toggle('oculto', v !== id)); }
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = /Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message;
  iniciar();
});
$('b-salir').onclick = async () => { await sb.auth.signOut(); vista('v-login'); };
$('b-recargar').onclick = () => cargar();

async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return vista('v-login');
  if (!PERMITIDOS.includes((data.session.user?.email || '').toLowerCase())) {
    await sb.auth.signOut(); vista('v-login');
    return $('l-error').textContent = 'Este usuario no tiene acceso al panel.';
  }
  vista('v-app'); dibujarTabs();
  $('sw-igv').checked = st.igv18;
  $('sw-igv').onchange = () => { st.igv18 = $('sw-igv').checked; guardar('igv18', st.igv18); pintar(); };
  $('b-fecha').onclick = () => calendario({ titulo: 'Periodo a ver', desde: st.desde, hasta: st.hasta,
    alElegir: (a, b) => { st.rango = 'libre'; st.desde = a; st.hasta = b; guardar('rango', 'libre'); guardar('desde', a); guardar('hasta', b); dibujarFiltros(); cargar(); } });
  if (st.rango === 'libre' && st.desde && st.hasta) { dibujarFiltros(); cargar(); } else aplicarRango(st.rango);
}

// ===== Filtros de fecha =====
const RANGOS = { hoy: 'Hoy', ayer: 'Ayer', '7d': '7 días', mes: 'Este mes', mes_ant: 'Mes anterior', '30d': '30 días', anio: 'Este año' };
const COMPS = { no: 'Nada', ant: 'Periodo anterior', anio: 'Mismo periodo año pasado', libre: '📅 Elegir fechas' };
const fLarga = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const fRango = (a, b) => a === b ? fLarga(a) : `${fLarga(a)} – ${fLarga(b)}`;
const dias = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5) + 1;
const menosAnio = s => { const [y, m, d] = s.split('-').map(Number); const u = new Date(y - 1, m, 0).getDate(); return `${y - 1}-${String(m).padStart(2, '0')}-${String(Math.min(d, u)).padStart(2, '0')}`; };
function rangoComp() {
  if (st.comp === 'ant') { const n = dias(st.desde, st.hasta); return [masDias(st.desde, -n), masDias(st.desde, -1)]; }
  if (st.comp === 'anio') return [menosAnio(st.desde), menosAnio(st.hasta)];
  if (st.comp === 'libre' && st.cDesde && st.cHasta) return [st.cDesde, st.cHasta];
  return null;
}
function dibujarFiltros() {
  $('t-fecha').textContent = fRango(st.desde, st.hasta);
  $('chips').innerHTML = Object.entries(RANGOS).map(([k, t]) => `<button class="chip ${st.rango === k ? 'activa' : ''}" data-r="${k}">${t}</button>`).join('');
  $('chips').onclick = e => { const r = e.target.dataset.r; if (r) aplicarRango(r); };
  $('chips-c').innerHTML = Object.entries(COMPS).map(([k, t]) => `<button class="chip ${st.comp === k ? 'activa' : ''}" data-c="${k}" ${st.comp === k && k !== 'no' ? 'style="background:#3d6b99"' : ''}>${t}</button>`).join('');
  $('chips-c').onclick = e => {
    const c = e.target.dataset.c; if (!c) return;
    if (c === 'libre') {
      const r = rangoComp() || [masDias(st.desde, -dias(st.desde, st.hasta)), masDias(st.desde, -1)];
      return calendario({ titulo: 'Comparar con este periodo', comp: true, desde: r[0], hasta: r[1],
        alElegir: (a, b) => { st.comp = 'libre'; st.cDesde = a; st.cHasta = b; guardar('comp', 'libre'); guardar('cdesde', a); guardar('chasta', b); dibujarFiltros(); cargar(); } });
    }
    st.comp = c; guardar('comp', c); dibujarFiltros(); cargar();
  };
  const rc = rangoComp();
  $('t-comp').innerHTML = rc ? `<b>${fRango(rc[0], rc[1])}</b>` : '';
}
function aplicarRango(r) {
  const h = hoy(), [y, m] = h.split('-');
  const R = {
    hoy: [h, h], ayer: [masDias(h, -1), masDias(h, -1)], '7d': [masDias(h, -6), h], '30d': [masDias(h, -29), h],
    mes: [`${y}-${m}-01`, h], anio: [`${y}-01-01`, h],
    mes_ant: (() => { const ini = new Date(+y, +m - 2, 1), fin = new Date(+y, +m - 1, 0); const f = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; return [f(ini), f(fin)]; })(),
  };
  if (!R[r]) r = 'mes';
  st.rango = r; [st.desde, st.hasta] = R[r]; guardar('rango', r);
  dibujarFiltros(); cargar();
}

// ===== Calendario: clic en la fecha inicial, se sombrea hasta la final, clic en la final =====
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function calendario({ titulo, desde, hasta, comp, alElegir }) {
  let a = desde, b = hasta, ver = (desde || hoy()).slice(0, 7);   // ver = 'YYYY-MM' del primer mes visible
  const anioMax = +hoy().slice(0, 4);
  const fondo = document.createElement('div'); fondo.className = 'cal-fondo';
  fondo.innerHTML = `<div class="cal ${comp ? 'comp' : ''}">
    <div class="cal-tit">${titulo}</div><div class="cal-paso" id="cal-paso"></div>
    <div class="cal-nav"><button data-n="-1">‹</button><select id="cal-m">${MESES.map((x, i) => `<option value="${i + 1}">${x}</option>`).join('')}</select>
      <select id="cal-a">${Array.from({ length: anioMax - 2019 }, (_, i) => anioMax - i).map(x => `<option>${x}</option>`).join('')}</select><span style="flex:1"></span><button data-n="1">›</button></div>
    <div class="cal-meses" id="cal-meses"></div>
    <div class="cal-pie"><button class="no">Cancelar</button><button class="si">Aplicar</button></div></div>`;
  document.body.appendChild(fondo);
  const q = s => fondo.querySelector(s);
  const mover = n => { let [y, m] = ver.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } ver = `${y}-${String(m).padStart(2, '0')}`; pintarCal(); };
  function mes(y, m) {
    const ini = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate(), h = hoy();
    let html = `<div class="cal-mes"><h4>${MESES[m - 1]} ${y}</h4><div class="cal-sem">${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x => `<span>${x}</span>`).join('')}</div><div class="cal-dias">`;
    for (let i = 0; i < ini; i++) html += '<span></span>';
    for (let d = 1; d <= n; d++) { const f = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; html += `<button data-f="${f}" class="${f === h ? 'hoy' : ''} ${f > h ? 'fut' : ''}">${d}</button>`; }
    return html + '</div></div>';
  }
  function sombrear(hasta2) {
    const fin = b || hasta2 || a, [x, y] = a && fin && fin < a ? [fin, a] : [a, fin];
    fondo.querySelectorAll('[data-f]').forEach(el => { const f = el.dataset.f;
      el.classList.toggle('ini', !!x && f === x); el.classList.toggle('fin', !!y && f === y); el.classList.toggle('rg', !!x && !!y && f > x && f < y); });

}

  const it = (x, campo, et = v => v) => (x?.[campo] || []).map(y => ({ name: et(y[{ por_canal: 'canal', por_tipo: 'tipo', por_metodo: 'metodo', por_comprobante: 'tipo' }[campo]]) || 'Sin dato', value: +V(y).toFixed(2) }));

  dona('g-tipo', it(d, 'por_tipo'), null, c ? it(c, 'por_tipo') : null);
  dona('g-metodo', it(d, 'por_metodo', etiquetaMetodo), null, c ? it(c, 'por_metodo', etiquetaMetodo) : null);
  const et = t => etiquetaTipoDoc[t] || t;
  dona('g-comp', it(d, 'por_comprobante', et), null, c ? it(c, 'por_comprobante', et) : null);
  const vm = d.ventas_mes || [], vmc = c?.ventas_mes || [];
  const desf = vm.length - vmc.length;   // alinear por el último mes
  const sM = [{ name: c ? 'Actual' : 'Ventas netas', type: 'line', smooth: true, data: vm.map(x => +V(x).toFixed(2)), color: '#8B0000', symbolSize: 7,
      areaStyle: { color: grad(0, 0, 0, 1, [{ offset: 0, color: 'rgba(139,0,0,.35)' }, { offset: 1, color: 'rgba(139,0,0,0)' }]) } }];
  if (c) sM.push(serieComp(vm.map((_, i) => vmc[i - desf] ? +V(vmc[i - desf]).toFixed(2) : null)));
  g('g-mes', {
    tooltip: { trigger: 'axis', formatter: ps => { const i = ps[0].dataIndex, x = vmc[i - desf];
      return `<b>${fMes(vm[i].mes)}</b>: ${S(V(vm[i]))}` + (c && x ? `<br><span style="color:${AZUL}">● ${fMes(x.mes)}: <b>${S(V(x))}</b> ${varTxt(V(vm[i]), V(x))}</span>` : ''); } },
    legend: c ? leyenda : undefined, grid: rejilla,
    xAxis: { type: 'category', data: vm.map(x => fMes(x.mes)), boundaryGap: false }, yAxis: ejeS, series: sM,
  });
}

function productos(d, c) {
  const tp = (d.top_productos || []).slice(0, 15), tpc = c?.top_productos || [];
  const deC = n => tpc.find(x => x.producto === n);
  $('main').innerHTML = `
    <div class="grid">
      ${caja('c7', 'Top 15 productos (venta neta)', tp.length ? '<div class="g alto" id="g-top"></div>' : vacio('Sin ventas'))}
      ${caja('c5', 'Ventas netas por categoría', '<div class="g alto" id="g-cat"></div>')}
    </div>
    <div class="grid">${caja('c12', 'Detalle top productos', tp.length ? `<div class="scroll"><table class="t">
      <tr><th>#</th><th>Producto</th><th class="n">Cantidad</th><th class="n">Venta neta</th><th class="n">Precio prom. (con IGV)</th>${c ? `<th class="n">Cant. comp.</th><th class="n">Neto comp.</th><th class="n">Var.</th>` : ''}</tr>
      ${tp.map((x, i) => { const y = deC(x.producto);
        return `<tr><td>${i + 1}</td><td>${esc(x.producto)}</td><td class="n">${num(x.cantidad).toLocaleString('es-PE')}</td><td class="n">${S(V(x))}</td><td class="n">${S(num(x.total) / Math.max(1, num(x.cantidad)))}</td>${c ? `<td class="n">${y ? num(y.cantidad).toLocaleString('es-PE') : '—'}</td><td class="n">${y ? S(V(y)) : '—'}</td><td class="n">${y ? `<span class="${V(x) >= V(y) ? 'pos' : 'neg'}">${varTxt(V(x), V(y))}</span>` : 'nuevo'}</td>` : ''}</tr>`; }).join('')}
    </table></div>` : vacio('Sin ventas'), c ? 'La comparación busca el mismo producto entre los 60 más vendidos del otro periodo.' : '')}</div>`;
  if (tp.length) barrasH('g-top', tp.map(x => x.producto), tp.map(x => +V(x).toFixed(2)), S, c ? tp.map(x => +V(deC(x.producto)).toFixed(2)) : null);
  const pc = d.por_categoria || [];
  if (c) return dona('g-cat', pc.map(x => ({ name: x.categoria, value: +V(x).toFixed(2) })), null, (c.por_categoria || []).map(x => ({ name: x.categoria, value: +V(x).toFixed(2) })));
  g('g-cat', {
    tooltip: { formatter: p => `${esc(p.name)}<br><b>${S(p.value)}</b>` },
    series: [{ type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false }, width: '100%', height: '100%',
      label: { formatter: p => `${p.name}\n${S0(p.value)}`, fontSize: 12 }, itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
      data: pc.map((x, i) => ({ name: x.categoria, value: +V(x).toFixed(2), itemStyle: { color: COL[i % COL.length] } })) }],
  });
}

function pCaja(d) {
  const t = d.turnos || [], an = d.anuladas || [];
  const fila = x => {
    const esperado = num(x.inicial) + num(x.efectivo);
    const dif = x.contado === null || x.contado === undefined ? null : num(x.contado) - esperado;
    const tag = x.estado !== 'cerrado' ? '<span class="tag av">Abierto</span>' : dif === null ? '<span class="tag">Sin conteo</span>' : Math.abs(dif) < 0.5 ? '<span class="tag ok">Cuadra</span>' : `<span class="tag mal">${dif > 0 ? 'Sobra' : 'Falta'}</span>`;
    return `<tr><td>${fh(x.abierto_en)}</td><td>${esc(x.turno || '—')}</td><td>${esc(x.caja)}</td><td>${esc(x.cajero || '—')}</td>
      <td class="n">${S(x.ventas)}</td><td class="n">${S(x.efectivo)}</td><td class="n">${S(x.pedidos)}</td>
      <td class="n">${dif === null ? '—' : `<span class="${Math.abs(dif) < 0.5 ? '' : dif > 0 ? 'pos' : 'neg'}">${S(dif)}</span>`}</td><td>${tag}</td><td class="n">${x.anuladas || 0}</td></tr>`;
  };
  const difs = t.filter(x => x.estado === 'cerrado' && x.contado !== null).map(x => num(x.contado) - num(x.inicial) - num(x.efectivo));
  $('main').innerHTML = `
    <div class="grid">
      ${kpi('Turnos', t.length, `${t.filter(x => x.estado !== 'cerrado').length} abierto(s)`)}
      ${kpi('Faltantes', S(difs.filter(x => x < -0.5).reduce((a, b) => a + b, 0)), `${difs.filter(x => x < -0.5).length} turno(s)`)}
      ${kpi('Sobrantes', S(difs.filter(x => x > 0.5).reduce((a, b) => a + b, 0)), `${difs.filter(x => x > 0.5).length} turno(s)`)}
      ${kpi('Anulaciones', an.length, S(an.reduce((a, x) => a + num(x.total), 0)))}
    </div>
    <div class="grid">${caja('c12', 'Cuadre por turno', t.length ? `<div class="scroll"><table class="t">
      <tr><th>Apertura</th><th>Turno</th><th>Caja</th><th>Cajero</th><th class="n">Ventas</th><th class="n">Efectivo</th><th class="n">Pedidos</th><th class="n">Diferencia</th><th></th><th class="n">Anul.</th></tr>
      ${t.map(fila).join('')}</table></div>` : vacio('No hay turnos en este periodo'), 'Diferencia = efectivo contado − (fondo inicial + ventas en efectivo). Los cobros de pedidos van aparte.')}</div>
    <div class="grid">${caja('c12', 'Comprobantes anulados', an.length ? `<div class="scroll"><table class="t">
      <tr><th>Fecha</th><th>Comprobante</th><th class="n">Total</th><th>Motivo</th></tr>
      ${an.map(x => `<tr><td>${fh(x.fecha)}</td><td>${esc(x.comprobante)}</td><td class="n">${S(x.total)}</td><td>${esc(x.justificacion || x.motivo || '')}</td></tr>`).join('')}</table></div>` : vacio('Sin anulaciones'))}</div>`;
}

function almacen(d) {
  const sk = d.stock || [], mv = d.movimientos || [], tm = d.top_mermas || [], pr = d.produccion || [];
  const suma = t => mv.filter(x => x.tipo === t).reduce((a, x) => a + num(x.valor), 0);
  const tipos = ['compra', 'produccion', 'consumo', 'merma', 'ajuste'], almacenes = [...new Set(mv.map(x => x.almacen))];
  $('main').innerHTML = `
    <div class="grid">
      ${kpi('Stock valorizado', S(sk.reduce((a, x) => a + num(x.valor), 0)), `${sk.reduce((a, x) => a + num(x.negativos), 0)} producto(s) en negativo`)}
      ${kpi('Compras', S(suma('compra')), 'Ingresos del periodo')}
      ${kpi('Mermas', S(suma('merma')), KV(d.kpis, 'ventas', 'neto') ? P(suma('merma') / KV(d.kpis, 'ventas', 'neto') * 100) + ' de la venta neta' : '')}
      ${kpi('Consumo producción', S(suma('consumo')), 'Diferencia de conteos')}
    </div>
    <div class="grid">
      ${caja('c5', 'Stock valorizado por almacén', sk.some(x => num(x.valor) > 0) ? '<div class="g" id="g-stock"></div>' : vacio('Sin stock'))}
      ${caja('c7', 'Movimientos por almacén (S/)', almacenes.length ? '<div class="g" id="g-mov"></div>' : vacio('Sin movimientos en el periodo'))}
    </div>
    <div class="grid">
      ${caja('c6', 'Top mermas', tm.length ? '<div class="g" id="g-merma"></div>' : vacio('Sin mermas en el periodo'))}
      ${caja('c6', 'Producción del periodo', pr.length ? `<div class="scroll"><table class="t"><tr><th>Producto</th><th class="n">Cantidad</th></tr>
        ${pr.map(x => `<tr><td>${esc(x.producto)}</td><td class="n">${num(x.cantidad).toLocaleString('es-PE', { maximumFractionDigits: 2 })} ${esc(x.unidad || '')}</td></tr>`).join('')}</table></div>` : vacio('Sin lotes de producción'))}
    </div>`;
  if (sk.some(x => num(x.valor) > 0)) dona('g-stock', sk.map(x => ({ name: x.almacen, value: num(x.valor) })));
  if (almacenes.length) {
    const ET = { compra: 'Compras', produccion: 'Producción', consumo: 'Consumo', merma: 'Merma', ajuste: 'Ajuste' };
    g('g-mov', {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: S }, legend: { top: 0, textStyle: { fontSize: 11 } }, grid: { ...rejilla, top: 36 },
      xAxis: { type: 'category', data: almacenes, axisLabel: { interval: 0, fontSize: 11 } }, yAxis: ejeS,
      series: tipos.map(t => ({ name: ET[t], type: 'bar', barMaxWidth: 16, data: almacenes.map(a => num(mv.find(x => x.tipo === t && x.almacen === a)?.valor)) })),
    });
  }
  if (tm.length) barrasH('g-merma', tm.map(x => x.producto), tm.map(x => num(x.valor)));
}

function costos(d) {
  const rc = d.recetas || [], m = margenes(d), mg = d.margen || {};
  const estado = fc => fc <= 28 ? '<span class="tag ok">Bien</span>' : fc <= 35 ? '<span class="tag av">Vigilar</span>' : '<span class="tag mal">Alto</span>';
  $('main').innerHTML = `
    <div class="grid">
      ${kpi('Food cost real', P(m.fc), 'Costo receta / venta neta')}
      ${kpi('Costo de lo vendido', S(mg.costo), `sobre ${S0(m.base)} de venta neta con receta`)}
      ${kpi('Margen bruto', S(num(m.base) - num(mg.costo)), P(100 - m.fc))}
      ${kpi('Recetas con costo', rc.length, `${rc.filter(x => num(x.fc) > 35).length} con food cost alto`)}
    </div>
    <div class="grid">
      ${caja('c4', 'Food cost del periodo', '<div class="g" id="g-fc"></div>', 'Verde ≤ 28% · ámbar ≤ 35% · rojo > 35%')}
      ${caja('c8', 'Food cost por receta (los más altos)', rc.length ? '<div class="g" id="g-rec"></div>' : vacio('Aún no hay recetas con precio'))}
    </div>
    <div class="grid">${caja('c12', 'Recetas', rc.length ? `<div class="scroll"><table class="t">
      <tr><th>Producto</th><th class="n">Costo</th><th class="n">Precio</th><th class="n">Food cost</th><th></th></tr>
      ${rc.map(x => `<tr><td>${esc(x.producto)}</td><td class="n">${S(x.costo)}</td><td class="n">${S(x.precio)}</td><td class="n">${P(x.fc)}</td><td>${estado(num(x.fc))}</td></tr>`).join('')}</table></div>` : vacio('Sin recetas'))}</div>`;
  termometro('g-fc', m.fc, 'Food cost', [[28, '#5b9e6b'], [35, '#e0b84a'], [60, '#c0392b']], 60);
  if (rc.length) {
    const top = rc.slice(0, 15);
    g('g-rec', {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => P(v) },
      grid: { left: 8, right: 50, top: 6, bottom: 6, containLabel: true }, xAxis: { type: 'value', show: false },
      yAxis: { type: 'category', inverse: true, data: top.map(x => x.producto), axisTick: { show: false }, axisLine: { show: false }, axisLabel: { width: movil() ? 110 : 200, overflow: 'truncate' } },
      series: [{ type: 'bar', barMaxWidth: 16, data: top.map(x => ({ value: +num(x.fc).toFixed(1), itemStyle: { color: num(x.fc) <= 28 ? '#5b9e6b' : num(x.fc) <= 35 ? '#e0b84a' : '#c0392b', borderRadius: [0, 6, 6, 0] } })),
        label: { show: true, position: 'right', formatter: p => p.value + '%', fontSize: 11 } }],
    });
  }
}

function egresos(d, c) {
  const e = d.egresos || {}, m = margenes(d), sy = e.sincronizado, ec = c?.egresos || {}, mc = margenes(c);
  const pc = e.por_categoria || [], ps = e.por_subcategoria || [];
  $('main').innerHTML = `
    <div class="grid"><div class="caja c12"><div class="sync">
      <button id="b-sync">⟳ Sincronizar Libro de Egresos</button>
      <span id="sync-txt">${sy ? `Última copia: ${fh(sy.ultima)} · ${sy.elementos ?? 0} registros · ${esc(sy.resultado || '')}` : 'Aún no se ha sincronizado'}</span>
    </div></div></div>
    <div class="grid">
      ${kpi('Egresos sin IGV', S(e.total), c ? vs(e.total, 0, ec.total) : `Pagado ${S0(e.total_con_igv)} · ${pc.reduce((a, x) => a + num(x.n), 0)} registro(s)`)}
      ${kpi('IGV crédito fiscal', S(e.igv), 'IGV de facturas de compra')}
      ${kpi('Egresos / ventas', P(m.egp), c ? `comparación: <b>${P(mc.egp)}</b>` : `venta neta ${S0(m.vsi)}`)}
      ${kpi('Resultado', `<span class="${m.vsi - m.eg >= 0 ? 'pos' : 'neg'}">${S(m.vsi - m.eg)}</span>`, c ? vs(m.vsi - m.eg, 0, mc.vsi - mc.eg) : 'Venta neta − egresos')}
    </div>
    <div class="grid">
      ${caja('c5', 'Por categoría', pc.length ? '<div class="g" id="g-ecat"></div>' : vacio('Sin egresos en el periodo'))}
      ${caja('c7', 'Categoría y subcategoría', ps.length ? '<div class="g" id="g-esub"></div>' : vacio('Sin egresos en el periodo'))}
    </div>
    <div class="grid">
      ${caja('c8', 'Ventas vs egresos (12 meses)', '<div class="g" id="g-ve"></div>')}
      ${caja('c4', 'Egresos / ventas', '<div class="g" id="g-eg"></div>', 'Verde ≤ 70% · ámbar ≤ 90% · rojo > 90%')}
    </div>
    <div class="grid">${caja('c12', 'Por tipo de comprobante', (e.por_comprobante || []).length ? `<div class="scroll"><table class="t">
      <tr><th>Comprobante</th><th class="n">Registros</th><th class="n">Sin IGV</th><th class="n">IGV</th><th class="n">Pagado</th></tr>
      ${e.por_comprobante.map(x => `<tr><td>${esc(x.tipo)}</td><td class="n">${x.n}</td><td class="n">${S(x.total)}</td><td class="n">${S(x.igv)}</td><td class="n">${S(num(x.total) + num(x.igv))}</td></tr>`).join('')}
      </table></div>` : vacio('Sin egresos'), `Pendiente de pago: <b>${S(e.pendiente)}</b>`)}</div>
    <div class="grid">${caja('c12', 'Detalle por subcategoría', ps.length ? `<div class="scroll"><table class="t">
      <tr><th>Categoría</th><th>Subcategoría</th><th class="n">Monto</th><th class="n">% del total</th></tr>
      ${ps.map(x => `<tr><td>${esc(x.categoria)}</td><td>${esc(x.subcategoria)}</td><td class="n">${S(x.total)}</td><td class="n">${P(num(x.total) / Math.max(1, num(e.total)) * 100)}</td></tr>`).join('')}</table></div>` : vacio('Sin egresos'))}</div>`;
  $('b-sync').onclick = () => sincronizar(true);
  if (pc.length) dona('g-ecat', pc.map(x => ({ name: x.categoria, value: num(x.total) })), S0(e.total), c ? (ec.por_categoria || []).map(x => ({ name: x.categoria, value: num(x.total) })) : null);
  if (ps.length) {
    const arbol = pc.map((c, i) => ({ name: c.categoria, itemStyle: { color: COL[i % COL.length] },
      children: ps.filter(s => s.categoria === c.categoria).map(s => ({ name: s.subcategoria, value: num(s.total) })) }));
    g('g-esub', {
      tooltip: { formatter: p => `${esc(p.treePathInfo.slice(1).map(x => x.name).join(' › '))}<br><b>${S(p.value)}</b>` },
      series: [{ type: 'sunburst', data: arbol, radius: ['12%', '92%'], sort: null, itemStyle: { borderColor: '#fff', borderWidth: 2 },
        levels: [{}, { r0: '12%', r: '50%', label: { rotate: 0, fontSize: 11, fontWeight: 700 } }, { r0: '50%', r: '92%', label: { fontSize: 10, show: !movil() } }] }],
    });
  }
  ventasVsEgresos('g-ve', d);
  termometro('g-eg', m.egp, 'Egresos', [[70, '#5b9e6b'], [90, '#e0b84a'], [150, '#c0392b']], 150);
}

// ===== Sincronización con Microsoft Lists =====
let sincronizando = false;
function revisarSync() {
  const u = st.d?.egresos?.sincronizado?.ultima;
  if (!u || Date.now() - new Date(u).getTime() > 3600e3) sincronizar(false);
}
async function sincronizar(manual) {
  if (sincronizando) return; sincronizando = true;
  const b = $('b-sync'), t = $('sync-txt');
  if (b) { b.disabled = true; b.textContent = '⟳ Sincronizando…'; }
  try {
    const { data, error } = await sb.functions.invoke('sync-egresos', { body: {} });
    if (error || !data?.ok) {
      let msg = data?.error || error?.message || 'Error';
      try { const j = await error?.context?.json?.(); if (j?.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    sincronizando = false;
    if (manual || st.tab === 'egresos') return cargar();
  } catch (e) {
    if (t && manual) t.innerHTML = `<span class="neg">No se pudo sincronizar: ${esc(e.message)}</span>`;
  } finally {
    sincronizando = false;
    if (b) { b.disabled = false; b.textContent = '⟳ Sincronizar Libro de Egresos'; }
  }
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') vista('v-login'); });
iniciar();
