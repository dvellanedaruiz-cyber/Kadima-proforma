<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadima · Costos</title>
<meta name="theme-color" content="#8B0000">
<style>
:root{--vino:#8B0000;--vino-s:#f7e9e9;--fondo:#f6f4f2;--card:#fff;--txt:#1f1f1f;--muted:#6f6a66;--borde:#ebe6e2;--sube:#c62828;--baja:#2e7d32;--suave:#faf7f5;--amb:#b26a00}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--txt);font-size:14px}
.oculto{display:none!important}
/* cabecera */
header{background:var(--vino);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;white-space:nowrap}
.tabs button.activa{background:rgba(255,255,255,.2);color:#fff}
.embebido header{background:#fff;color:var(--txt);border-bottom:1px solid var(--borde);padding:8px 16px}
.embebido header h1{display:none}
.embebido .tabs button{color:var(--muted)}
.embebido .tabs button:hover{background:var(--suave)}
.embebido .tabs button.activa{background:var(--vino-s);color:var(--vino)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.solo .tabs button:not([data-tab="cargar"]){display:none}
/* bloques */
.bloque{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:14px}
.bloque h3{margin:0 0 4px;font-size:15px}
.ayuda{color:var(--muted);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filtros .lbl{font-size:12px;color:var(--muted);margin-right:-4px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--borde);border-radius:9px;background:#fff;color:var(--txt);min-width:0}
input:focus,select:focus{outline:2px solid #e9c9c9;border-color:#d9a9a9}
.chips{display:inline-flex;background:var(--suave);border:1px solid var(--borde);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.chips button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.chips button.activa{background:#fff;color:var(--vino);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{background:var(--vino);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:#fff;color:var(--vino);border:1px solid #e3c6c6}
.btn.peq{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--vino);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sube{color:var(--sube)}.baja{color:var(--baja)}.amb{color:var(--amb)}
.grafico{width:100%;height:320px}
.grafico.bajo{height:220px}
.tablawrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--borde);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;background:#fff;position:sticky;top:0}
table.t th.ord{cursor:pointer}
table.t td{padding:8px 8px;border-bottom:1px solid #f2eeea;vertical-align:middle}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:var(--suave)}
table.t tr.sel td{background:#fbeeee}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cod{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;color:#555;white-space:nowrap;font-weight:600}
.tag.compra{background:#e8f1fb;color:#1f5d99}.tag.hist{background:#f3eadf;color:#8a5a12}.tag.ini{background:#ece8f6;color:#5b3d99}
.tag.ok{background:#e7f4ea;color:#1e6b34}.tag.mal{background:#fbe9e9;color:#a52222}.tag.med{background:#fff3df;color:#8a5a00}
.tag.A{background:#8B0000;color:#fff}.tag.B{background:#e8c9c9;color:#6b1010}.tag.C{background:#eee;color:#666}
.barrita{display:flex;align-items:center;gap:8px;min-width:120px}
.barrita i{display:block;height:8px;border-radius:4px;background:var(--vino);opacity:.75}
.barrita span{font-variant-numeric:tabular-nums;white-space:nowrap}
.vacio{color:var(--muted);text-align:center;padding:28px 16px;line-height:1.6}
.error{color:var(--sube);font-size:13px}
.okmsg{color:var(--baja);font-size:13px}
.det-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.det-cab h3{margin:0}
.cerrar{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid-l{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end}
.form label,.campo{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form .full{grid-column:1/-1}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--txt)!important;font-size:13px!important}
.cargando{color:var(--muted);padding:30px;text-align:center}
.nota{background:var(--suave);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
.nota b{color:var(--txt)}
.titular{font-size:17px;line-height:1.45;margin:0 0 6px}
.titular b{color:var(--vino)}
.pildoras{display:flex;flex-wrap:wrap;gap:6px}
.pildoras button{border:1px solid var(--borde);background:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.pildoras button:hover{border-color:#d9a9a9}
.sticky-l{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
#login{max-width:340px;margin:60px auto}
#login form{display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){
  .grid-l{grid-template-columns:minmax(0,1fr)}
  .grid-l>*{min-width:0}
  .sticky-l{position:static;max-height:none}
}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.form{grid-template-columns:1fr}
  .m-ocultar{display:none}
  .grafico{height:260px}
  main{padding:12px 12px 40px}
  .kpi .v{font-size:19px}
}
</style>
</head>
<body>

<section id="login" class="oculto">
  <div class="bloque">
    <h3>Kadima · Costos</h3>
    <form id="f-login" style="margin-top:10px">
      <input id="l-email" type="email" placeholder="Correo" value="admin@kadima.pe" required>
      <input id="l-pass" type="password" placeholder="Contraseña" required>
      <button class="btn" style="justify-content:center">Entrar</button>
      <div id="l-error" class="error"></div>
    </form>
  </div>
</section>

<section id="app" class="oculto">
  <header>
    <h1>📈 Costos</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="evolucion">Evolución de insumos</button>
      <button data-tab="impacto">Impacto en productos</button>
      <button data-tab="precios">Precios y elasticidad</button>
      <button data-tab="pareto">Pareto de insumos</button>
      <button data-tab="cargar">Cargar históricos</button>
    </nav>
  </header>
  <main id="main"></main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
const EMBEBIDO = window.self !== window.top;
// ?solo=cargar → solo la pestaña de carga de costos (acceso de Logística)
const SOLO = new URLSearchParams(location.search).get('solo');
if (SOLO) document.documentElement.classList.add('solo');
if (EMBEBIDO) document.documentElement.classList.add('embebido');
// misma sesión que Kadima Gestión
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: EMBEBIDO ? (() => { try { return window.parent.KADIMA_AUTH_KEY || 'kadima-gestion-auth'; } catch (e) { return 'kadima-gestion-auth'; } })() : 'kadima-gestion-auth' } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const num = (v, dec = 2) => Number(v).toLocaleString('es-PE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const S = (v, dec = 2) => v == null || !isFinite(v) ? '—' : 'S/ ' + num(v, dec);
const P = (v, dec = 1) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : '') + (v * 100).toFixed(dec) + '%';
const PCT = (v, dec = 1) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(dec) + '%';
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const fechaTxt = f => { const [y, m, d] = f.split('-'); return `${d}/${m}/${y}`; };
const mesTxt = f => { const [y, m] = f.split('-'); return `${MESES[+m - 1]} ${y.slice(2)}`; };
const UNI = u => ({ Kilo: 'kg', Litro: 'L', Unidad: 'und' }[u] || u || '');
const cant = (v, u) => { const x = Number(v); if (u === 'Kilo' && x < 1) return num(x * 1000, 0) + ' g'; if (u === 'Litro' && x < 1) return num(x * 1000, 0) + ' mL'; return num(x, x < 10 ? 2 : 0) + ' ' + UNI(u); };
const TIPOS = [['insumo', 'Insumos'], ['paqueteria', 'Paquetería'], ['mercaderia', 'Mercadería'], ['', 'Todos']];
const usuarioId = () => { try { return (window.parent && window.parent.KADIMA_USUARIO && window.parent.KADIMA_USUARIO.id) || null; } catch (e) { return null; } };
const leer = k => { try { return localStorage.getItem('kcostos_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('kcostos_' + k, v); } catch (e) {} };
const errTxt = e => /fetch/i.test(e?.message || '') ? 'Sin conexión a internet.' : (e?.message || String(e));
const ROJO = '#8B0000', AZUL = '#1f5d99', GRIS = '#9a948f';

const hoy = new Date();
const st = {
  tab: leer('tab') || 'evolucion', prods: [], catalogo: null, charts: {},
  // evolución
  datos: [], rango: leer('rango') || '12m', tipo: leer('tipo') ?? 'insumo', base: leer('base') || 'neto', agr: leer('agr') || 'mes', q: '',
  orden: 'var', ordenDir: -1, sel: null, comparar: new Set(), evolCache: {},
  // impacto
  imp: { id: Number(leer('imp_id')) || null, rango: leer('imp_rango') || '12m', modo: 'subio', v: null, datos: null, vEvol: null, desde: null },
  // precios
  pre: { rango: leer('pre_rango') || '12m', cat: '', q: '', sel: null, datos: null, clave: '' },
  // pareto
  par: { rango: leer('par_rango') || '3m', por: leer('par_por') || 'venta', datos: null, clave: '' },
};

// ===== SESIÓN =====
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = /Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos.' : errTxt(error);
  iniciar();
});
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  await cargarProductos();
  irTab(st.tab);
}
$('tabs').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) irTab(t.dataset.tab); };
function irTab(t) {
  if (SOLO) t = SOLO;
  if (!['evolucion', 'impacto', 'precios', 'pareto', 'cargar'].includes(t)) t = 'evolucion';
  st.tab = t; if (!SOLO) guardar('tab', t);
  [...$('tabs').children].forEach(b => b.classList.toggle('activa', b.dataset.tab === t));
  limpiarGraficos(); window.scrollTo(0, 0);
  ({ evolucion: tabEvolucion, impacto: tabImpacto, precios: tabPrecios, pareto: tabPareto, cargar: tabCargar })[t]();
}
function limpiarGraficos() { Object.values(st.charts).forEach(c => c && c.dispose()); st.charts = {}; }
function grafico(id, op) { if (st.charts[id]) st.charts[id].dispose(); const c = echarts.init($(id)); c.setOption(op); st.charts[id] = c; return c; }
window.addEventListener('resize', () => Object.values(st.charts).forEach(c => c && c.resize()));

async function traerTodo(armar) {
  let out = [], i = 0;
  for (;;) {
    const { data, error } = await armar().range(i, i + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    i += 1000;
  }
  return out;
}
async function cargarProductos() {
  try {
    st.prods = await traerTodo(() => sb.from('productos').select('id,codigo,nombre,tipo_item,unidad_medida,afecto_igv').in('tipo_item', ['insumo', 'paqueteria', 'mercaderia']).order('nombre'));
  } catch (e) { st.prods = []; }
}
async function cargarCatalogo() {
  if (st.catalogo) return st.catalogo;
  const [prods, cats] = await Promise.all([
    traerTodo(() => sb.from('productos').select('id,codigo,nombre,tipo_item,categoria_id,precio_venta').order('id')),
    sb.from('categorias').select('id,nombre,categoria_principal').then(r => r.data || []),
  ]);
  const catMap = new Map(cats.map(c => [c.id, c]));
  st.catalogo = new Map(prods.map(p => [p.id, { ...p, categoria: (catMap.get(p.categoria_id) || {}).nombre || 'Sin categoría', principal: (catMap.get(p.categoria_id) || {}).categoria_principal || 'Sin categoría' }]));
  return st.catalogo;
}
function buscarProd(txt) {
  const t = String(txt || '').trim().toUpperCase();
  if (!t) return null;
  return st.prods.find(x => t.startsWith(String(x.codigo).toUpperCase() + ' ')) || st.prods.find(x => String(x.codigo).toUpperCase() === t)
    || st.prods.find(x => x.nombre.toUpperCase() === t);
}
const opcionInsumo = p => `${p.codigo} · ${p.nombre} (${UNI(p.unidad_medida) || 'sin unidad'})`;

// ===== RANGOS =====
const RANGOS = [['3m', '3 meses'], ['6m', '6 meses'], ['12m', '12 meses'], ['anio', 'Este año'], ['todo', 'Todo']];
function desdeDe(r) {
  const d = new Date(hoy);
  if (r === '1m') d.setMonth(d.getMonth() - 1);
  else if (r === '3m') d.setMonth(d.getMonth() - 3);
  else if (r === '6m') d.setMonth(d.getMonth() - 6);
  else if (r === '12m') d.setMonth(d.getMonth() - 12);
  else if (r === '18m') d.setMonth(d.getMonth() - 18);
  else if (r === '24m') d.setMonth(d.getMonth() - 24);
  else if (r === 'anio') { d.setMonth(0); d.setDate(1); }
  else return '2000-01-01';
  return iso(d);
}
const chipsHtml = (id, ops, val) => `<div class="chips" id="${id}">${ops.map(([k, t]) => `<button data-k="${k}" class="${val === k ? 'activa' : ''}">${t}</button>`).join('')}</div>`;
function chipsOn(id, cb) {
  $(id).onclick = e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('activa', x === b));
    cb(b.dataset.k);
  };
}

// ===== SERIES DE COSTO (compartido) =====
function periodo(f, agr) {
  if (agr === 'mes') return f.slice(0, 7) + '-01';
  const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d);
}
function periodoTxt(k, agr) { const [y, m, d] = k.split('-'); return agr === 'mes' ? `${MESES[+m - 1]} ${y.slice(2)}` : `${d}/${m}`; }
function seriesInsumos(rows, base, agr) {
  const precio = r => Number(base === 'neto' ? r.costo_neto : r.costo_bruto);
  const por = new Map();
  for (const r of rows) {
    if (!(precio(r) >= 0)) continue;
    if (!por.has(r.producto_id)) por.set(r.producto_id, { id: r.producto_id, codigo: r.codigo, nombre: r.nombre, unidad: r.unidad_medida, tipo: r.tipo_item, filas: [] });
    por.get(r.producto_id).filas.push(r);
  }
  const items = [];
  for (const it of por.values()) {
    const per = new Map(); let min = Infinity, max = -Infinity, gasto = 0;
    for (const r of it.filas) {
      const p = precio(r), w = Number(r.cantidad) > 0 ? Number(r.cantidad) : 1, k = periodo(r.fecha, agr);
      if (!per.has(k)) per.set(k, { s: 0, w: 0 });
      const a = per.get(k); a.s += p * w; a.w += w;
      min = Math.min(min, p); max = Math.max(max, p);
      if (r.fuente === 'compra') gasto += p * (Number(r.cantidad) || 0);
    }
    it.serie = [...per.keys()].sort().map(k => ({ k, v: per.get(k).s / per.get(k).w }));
    it.ini = it.serie[0].v; it.ult = it.serie[it.serie.length - 1].v;
    it.iniK = it.serie[0].k;
    it.var = it.serie.length > 1 && it.ini > 0 ? it.ult / it.ini - 1 : null;
    it.min = min; it.max = max; it.gasto = gasto; it.n = it.filas.length;
    it.ultFecha = it.filas[it.filas.length - 1].fecha;
    items.push(it);
  }
  return items;
}
async function cargarEvol(desde) {
  if (st.evolCache[desde]) return st.evolCache[desde];
  const rows = await traerTodo(() => sb.from('v_costos_evolucion').select('*').gte('fecha', desde).lte('fecha', iso(hoy)).order('fecha').order('producto_id'));
  st.evolCache[desde] = rows;
  return rows;
}

// ======================================================
// EVOLUCIÓN
// ======================================================
async function tabEvolucion() {
  $('main').innerHTML = `
  <div class="bloque">
    <div class="filtros">
      ${chipsHtml('f-rango', RANGOS, st.rango)}
      ${chipsHtml('f-tipo', TIPOS, st.tipo)}
      ${chipsHtml('f-base', [['neto', 'Sin IGV'], ['bruto', 'Con IGV']], st.base)}
      ${chipsHtml('f-agr', [['mes', 'Por mes'], ['semana', 'Por semana']], st.agr)}
      <input id="f-q" placeholder="🔍 Buscar insumo o código" value="${esc(st.q)}" style="flex:1;min-width:180px">
    </div>
  </div>
  <div id="contenido"><div class="cargando">Cargando costos…</div></div>`;
  chipsOn('f-rango', k => { st.rango = k; guardar('rango', k); cargarDatos(); });
  chipsOn('f-tipo', k => { st.tipo = k; guardar('tipo', k); pintar(); });
  chipsOn('f-base', k => { st.base = k; guardar('base', k); pintar(); });
  chipsOn('f-agr', k => { st.agr = k; guardar('agr', k); pintar(); });
  $('f-q').oninput = () => { st.q = $('f-q').value.trim().toLowerCase(); pintar(); };
  cargarDatos();
}
async function cargarDatos() {
  $('contenido').innerHTML = '<div class="cargando">Cargando costos…</div>';
  try { st.datos = await cargarEvol(desdeDe(st.rango)); }
  catch (e) { return $('contenido').innerHTML = `<div class="bloque error">${esc(errTxt(e))}<br><small>¿Ya corriste los scripts 39 y 40?</small></div>`; }
  pintar();
}

function calcImpacto() {

    const impU = ciDesp - ciAntes, mensual = impU * Number(p.unidades) / (st.imp.datos.dias / 30);

  });

// regresión: ln(q/día) = a + b·ln(precio) + c·ln(venta local/día)
function ols(X, y) {
  const k = X[0].length, A = Array.from({ length: k }, () => Array(k).fill(0)), bb = Array(k).fill(0);
  for (let i = 0; i < y.length; i++) for (let a = 0; a < k; a++) { bb[a] += X[i][a] * y[i]; for (let c = 0; c < k; c++) A[a][c] += X[i][a] * X[i][c]; }
  for (let i = 0; i < k; i++) {   // Gauss
    let m = i; for (let r = i + 1; r < k; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [bb[i], bb[m]] = [bb[m], bb[i]];
    if (Math.abs(A[i][i]) < 1e-12) return null;
    for (let r = 0; r < k; r++) if (r !== i) { const f = A[r][i] / A[i][i]; for (let c = i; c < k; c++) A[r][c] -= f * A[i][c]; bb[r] -= f * bb[i]; }
  }
  const beta = bb.map((v, i) => v / A[i][i]);
  const ym = y.reduce((a, v) => a + v, 0) / y.length;
  let ssr = 0, sst = 0;
  y.forEach((v, i) => { const f = X[i].reduce((a, x, j) => a + x * beta[j], 0); ssr += (v - f) ** 2; sst += (v - ym) ** 2; });
  return { beta, r2: sst > 0 ? 1 - ssr / sst : 0 };
}
function corr(a, b) {
  const n = a.length; if (n < 3) return null;
  const ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0;
  for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
  return saa && sbb ? sab / Math.sqrt(saa * sbb) : null;
}
function armarPrecios(data, cat) {
  const meses = data.meses.map(m => ({ mes: m.mes, dias: Math.max(1, m.dias), venta: Number(m.venta), neta: Number(m.venta_neta) }));
  const mesMap = new Map(meses.map(m => [m.mes, m]));
  const por = new Map();
  for (const [mes, pid, u, t, n, pl, pmin, pmax] of data.filas) {
    if (!por.has(pid)) por.set(pid, []);
    const m = mesMap.get(mes) || { dias: 30, venta: 0 };
    const cobrado = Number(t) / Number(u), lista = Number(pl) > 0 ? Number(pl) : null;
    por.get(pid).push({ mes, u: Number(u), t: Number(t), n: Number(n), precio: lista ?? cobrado, cobrado, lista,
      pmin: Number(pmin) || null, pmax: Number(pmax) || null, upd: Number(u) / m.dias, tpd: m.venta / m.dias });
  }
  const productos = [];
  for (const [pid, filas] of por) {
    const p = cat.get(pid) || { nombre: 'Producto #' + pid, codigo: '', categoria: 'Sin categoría', precio_venta: null };
    filas.sort((a, b) => a.mes.localeCompare(b.mes));
    const tot = filas.reduce((a, f) => a + f.t, 0), uTot = filas.reduce((a, f) => a + f.u, 0);
    const pIni = filas[0].precio, pUlt = filas[filas.length - 1].precio;
    const ventana = n => filas.slice(n).reduce((a, f) => a + f.upd, 0) / Math.max(1, filas.slice(n).length);
    const uIni = filas.slice(0, 3).reduce((a, f) => a + f.upd, 0) / Math.min(3, filas.length), uUlt = ventana(-3);

    let ela = null, r2 = null, conf = 'sin datos';
    if (ok.length >= 6 && rangoP >= 0.03) {

    } else if (ok.length >= 2 && rangoP < 0.03) conf = 'precio estable';

    const antes = f.slice(Math.max(0, i - 2), i), desp = f.slice(i, i + 2);
    const q = a => a.reduce((s, x) => s + x.upd / x.tpd, 0) / a.length;   // unidades por S/ de venta del local

    const upa = antes.reduce((s, x) => s + x.upd, 0) / antes.length, upd = desp.reduce((s, x) => s + x.upd, 0) / desp.length;

async function cargarPareto() {
  const desde = desdeDe(st.par.rango);
  if (st.par.clave !== desde || !st.par.datos) {
    $('a-cont').innerHTML = '<div class="cargando">Calculando…</div>';

      if (r.error) throw r.error;
      st.par.datos = r.data; st.par.evol = seriesInsumos(evol, 'neto', 'mes'); st.par.clave = desde;
    } catch (e) { return $('a-cont').innerHTML = `<div class="bloque error">${esc(errTxt(e))}<br><small>¿Ya corriste el script 41_costos_analisis.sql?</small></div>`; }
  }

function calcPareto() {
  const d = st.par.datos, porVenta = st.par.por === 'venta';
  const peso = pr => Number(porVenta ? pr.venta_neta : pr.unidades) || 0;
  const pesoIns = new Map();
  for (const pr of d.productos) for (const i of pr.insumos || []) pesoIns.set(i, (pesoIns.get(i) || 0) + peso(pr));
  const total = d.productos.reduce((a, pr) => a + peso(pr), 0);
  const evol = new Map((st.par.evol || []).map(e => [e.id, e]));
  const ins = d.insumos.map(i => {
    const e = evol.get(i.insumo_id), costo = Number(i.costo) || 0;
    const v = e && e.ini > 0 && costo > 0 ? costo / e.ini - 1 : null;
    const soles = Number(i.consumo) * costo;
    return { ...i, peso: pesoIns.get(i.insumo_id) || 0, share: total ? (pesoIns.get(i.insumo_id) || 0) / total : 0, soles, v, impacto: v != null ? soles - soles / (1 + v) : null };
  }).sort((a, b) => b.peso - a.peso || b.soles - a.soles);
  const rank = new Map(ins.map((i, k) => [i.insumo_id, k + 1]));
  const cubiertoEn = new Array(ins.length + 1).fill(0);
  for (const pr of d.productos) { const mx = Math.max(...(pr.insumos || []).map(i => rank.get(i) || ins.length)); cubiertoEn[mx] += peso(pr); }
  let acum = 0;
  ins.forEach((i, k) => { acum += cubiertoEn[k + 1]; i.cob = total ? acum / total : 0; });
  const n80 = (ins.findIndex(i => i.cob >= 0.8 - 1e-9) + 1) || ins.length;
  const n95 = (ins.findIndex(i => i.cob >= 0.95 - 1e-9) + 1) || ins.length;
  ins.forEach((i, k) => { i.clase = k < n80 ? 'A' : k < n95 ? 'B' : 'C'; });
  return { ins, total, n80, porVenta };
}

function parseFecha(v) {
  if (v == null || v === '') return null;
  let y, m, d;
  if (typeof v === 'number') {
    const f = new Date(Math.round((v - 25569) * 86400000));
    y = f.getUTCFullYear(); m = f.getUTCMonth() + 1; d = f.getUTCDate();
  } else {
    const s = String(v).trim().toLowerCase(); let x;
    if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) [y, m, d] = [+x[1], +x[2], +x[3]];
    else if ((x = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) [d, m, y] = [+x[1], +x[2], +x[3]];
    else if ((x = s.match(/^(\d{4})[\/\-](\d{1,2})$/))) [y, m, d] = [+x[1], +x[2], 1];
    else if ((x = s.match(/^(\d{1,2})[\/\-](\d{4})$/))) [m, y, d] = [+x[1], +x[2], 1];
    else if ((x = s.match(/^([a-záéíóú]+)\.?[\s\-\/]*(?:de\s+|del\s+)?(\d{2,4})$/))) {
      const t = x[1].normalize('NFD').replace(/[̀-ͯ]/g, '').slice(0, 3);
      const i = MESES.indexOf(t === 'sep' ? 'set' : t);
      if (i < 0) return null;
      [y, m, d] = [+x[2], i + 1, 1];
    } else return null;
    if (y < 100) y += 2000;
  }
  const f = new Date(y, m - 1, d);
  if (f.getFullYear() !== y || f.getMonth() !== m - 1 || f.getDate() !== d) return null;
  return iso(f);
}
function parseCosto(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/s\/|\s/gi, '');
  if (!s) return null;
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.'); else s = s.replace(/,/g, '');
  const n = parseFloat(s); return isNaN(n) ? null : n;
}

  if (error) return $('m-msg').innerHTML = `<span class="error">${esc(errTxt(error))}</span>`;
  if (data.errores && data.errores.length) return $('m-msg').innerHTML = `<span class="error">${esc(data.errores[0].error)}</span>`;
  $('m-msg').innerHTML = `<span class="okmsg">✓ Guardado: ${esc(p.nombre)} ${fechaTxt(fecha)}</span>`;
  $('m-costo').value = ''; $('m-nota').value = ''; $('m-costo').focus(); st.evolCache = {};
  listarHistoricos();
}
async function listarHistoricos() {
  const { data, error } = await sb.from('v_costos_evolucion').select('*').eq('fuente', 'histórico').order('fecha', { ascending: false }).order('nombre').limit(200);
  if (!$('h-lista')) return;
  if (error) return $('h-lista').innerHTML = `<span class="error">${esc(errTxt(error))}<br><small>¿Ya corriste los scripts 39 y 40?</small></span>`;
  $('h-lista').className = '';
  $('h-lista').innerHTML = data.length ? `<div class="tablawrap"><table class="t">
    <tr><th>Fecha</th><th>Insumo</th><th class="n">Sin IGV</th><th class="n m-ocultar">Con IGV</th><th class="m-ocultar">Proveedor</th><th class="m-ocultar">Nota</th><th></th></tr>
    ${data.map(r => `<tr><td>${fechaTxt(r.fecha)}</td><td>${esc(r.nombre)}<br><span class="cod">${esc(r.codigo)} · por ${UNI(r.unidad_medida)}</span></td>
      <td class="n">${S(r.costo_neto, 3)}</td><td class="n m-ocultar">${S(r.costo_bruto, 3)}</td><td class="m-ocultar">${esc(r.proveedor || '')}</td>
      <td class="m-ocultar cod">${esc(r.referencia === 'Registro histórico' ? '' : r.referencia)}</td>
      <td><button class="cerrar" style="font-size:16px" data-borrar="${r.hist_id}" title="Borrar">🗑</button></td></tr>`).join('')}
  </table></div>${data.length === 200 ? '<p class="ayuda">Mostrando los últimos 200.</p>' : ''}` : '<div class="vacio">Aún no hay costos históricos.</div>';
  $('h-lista').querySelectorAll('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Borrar este costo histórico? No afecta stock ni compras.')) return;
    const { error } = await sb.from('costos_historicos').delete().eq('id', Number(b.dataset.borrar));
    if (error) return alert(errTxt(error));
    st.evolCache = {}; listarHistoricos();
  });
}

iniciar();
</script>
