<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadima · RH</title>
<meta name="theme-color" content="#8B0000">
<style>
:root{--vino:#8B0000;--vino-s:#f7e9e9;--fondo:#f6f4f2;--card:#fff;--txt:#1f1f1f;--muted:#6f6a66;--borde:#ebe6e2;--mal:#c62828;--ok:#2e7d32;--suave:#faf7f5;--amb:#b26a00}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--txt);font-size:14px}
.oculto{display:none!important}
header{background:var(--vino);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;white-space:nowrap}
.tabs button.activa{background:rgba(255,255,255,.2);color:#fff}
.embebido header{background:#fff;color:var(--txt);border-bottom:1px solid var(--borde);padding:8px 16px}
.embebido header h1{display:none}
.embebido .tabs button{color:var(--muted)}
.embebido .tabs button:hover{background:var(--suave)}
.embebido .tabs button.activa{background:var(--vino-s);color:var(--vino)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.bloque{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:14px}
.bloque h3{margin:0 0 4px;font-size:15px}
.ayuda{color:var(--muted);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.barra-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.barra-acc .esp{flex:1}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--borde);border-radius:9px;background:#fff;color:var(--txt);min-width:0;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid #e9c9c9;border-color:#d9a9a9}
.chips{display:inline-flex;background:var(--suave);border:1px solid var(--borde);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.chips button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.chips button.activa{background:#fff;color:var(--vino);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{background:var(--vino);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.sec{background:#fff;color:var(--vino);border:1px solid #e3c6c6}
.btn.gris{background:var(--suave);color:var(--txt);border:1px solid var(--borde)}
.btn.peq{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.tablawrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--borde);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;background:#fff}
table.t td{padding:8px;border-bottom:1px solid #f2eeea;vertical-align:middle}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:var(--suave)}
table.t tr.baja td{color:#9a948f}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cod{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;color:#555;white-space:nowrap;font-weight:600}
.tag.ok{background:#e7f4ea;color:#1e6b34}.tag.mal{background:#fbe9e9;color:#a52222}.tag.med{background:#fff3df;color:#8a5a00}.tag.az{background:#e8f1fb;color:#1f5d99}
.vacio{color:var(--muted);text-align:center;padding:28px 16px;line-height:1.6}
.error{color:var(--mal);font-size:13px;min-height:16px}
.cargando{color:var(--muted);padding:30px;text-align:center}
.nota{background:var(--suave);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
#login{max-width:340px;margin:60px auto}
#login form{display:flex;flex-direction:column;gap:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal .caja{background:#fff;border-radius:16px;width:100%;max-width:820px;padding:18px 18px 14px}
.modal .cab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.modal .cab h3{margin:0;font-size:17px;flex:1}
.cerrar{background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.secc{font-size:12px;font-weight:700;color:var(--vino);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--borde)}
.secc:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.form .d2{grid-column:span 2}.form .d4{grid-column:1/-1}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--txt)!important;font-size:13px!important;padding-top:18px}
.pie{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde)}
.pie .esp{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:92vw}
/* accesos */
.pin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.roles div{background:var(--suave);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45}
.roles b{display:block;color:var(--vino)}
/* horarios */
.pinceles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pinceles button{border:2px solid transparent;border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#fff;display:inline-flex;gap:6px;align-items:center}
.pinceles button small{font-weight:500;opacity:.85}
.pinceles button.on{outline:3px solid #f2a900;outline-offset:2px}
.pinceles .borrar{background:#fff;color:var(--txt);border-color:var(--borde)}
.semana{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.semana b{font-size:15px;min-width:220px;text-align:center}
table.hor{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
table.hor th{font-size:12px;color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.hor th.hoy{color:var(--vino)}
table.hor th:first-child,table.hor td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:130px}
table.hor td.p{font-weight:600;font-size:13px;padding:4px}
table.hor td.p small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
table.hor td.c{height:44px;border-radius:9px;text-align:center;cursor:pointer;font-weight:800;font-size:13px;border:1.5px dashed var(--borde);color:#bbb;user-select:none}
table.hor td.c:hover{border-color:#d9a9a9}
table.hor td.c.lleno{border:0;color:#fff}
table.hor td.c small{display:block;font-weight:500;font-size:10.5px;opacity:.9}
table.hor td.c.hoy{box-shadow:inset 0 0 0 2px #f2a900}
table.hor tr.tot td{font-size:11.5px;color:var(--muted);text-align:center;padding-top:8px}
table.hor tr.area td{font-size:11.5px;font-weight:700;color:var(--vino);text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 2px}
.turnos-ed td input{padding:5px 7px}
.turnos-ed input[type=color]{width:42px;height:32px;padding:2px}
@media (max-width:760px){
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .d2{grid-column:1/-1}
  main{padding:12px 12px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-ocultar{display:none}
}
</style>
</head>
<body>

<section id="login" class="oculto">
  <div class="bloque">
    <h3>Kadima · RH</h3>
    <form id="f-login" style="margin-top:10px">
      <input id="l-email" type="email" placeholder="Correo" value="admin@kadima.pe" required>
      <input id="l-pass" type="password" placeholder="Contraseña" required>
      <button class="btn" style="justify-content:center">Entrar</button>
      <div id="l-error" class="error"></div>
    </form>
  </div>
</section>

<section id="app" class="oculto">
  <header>
    <h1>👥 RH</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="trab">Trabajadores</button>
      <button data-tab="acc">Accesos y PIN</button>
      <button data-tab="hor">Horarios</button>
    </nav>
  </header>
  <main id="main"></main>
</section>

<div id="modal" class="modal oculto"><div class="caja" id="modal-caja"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// =====================================================================
// Kadima RH · trabajadores, accesos (PIN) y horarios
// Necesita rh_1_trabajadores_accesos_horarios.sql en Supabase.
// =====================================================================
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
const EMBEBIDO = window.self !== window.top;
if (EMBEBIDO) document.documentElement.classList.add('embebido');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: EMBEBIDO ? (() => { try { return window.parent.KADIMA_AUTH_KEY || 'kadima-gestion-auth'; } catch (e) { return 'kadima-gestion-auth'; } })() : 'kadima-gestion-auth' } });
const URL_HORARIO = 'https://kadima.pe/horario';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const deIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fechaTxt = f => f ? f.split('-').reverse().join('/') : '—';
const S = v => v == null || v === '' ? '—' : 'S/ ' + Number(v).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const errTxt = e => { const m = e?.message || String(e); return /fetch|network/i.test(m) ? 'Sin conexión a internet.' : /trabajadores|turnos|horario_dias/.test(m) && /exist|schema cache/.test(m) ? 'Falta correr rh_1_trabajadores_accesos_horarios.sql en Supabase.' : /usuarios_pin_unico/.test(m) ? 'Ese PIN ya lo usa otro usuario.' : /trabajadores_corto/.test(m) ? 'Ya hay otro trabajador activo con ese nombre corto.' : /trabajadores_doc/.test(m) ? 'Ya existe un trabajador con ese documento.' : /usuarios_rol_check/.test(m) ? 'Rol no permitido.' : /row-level security/.test(m) ? 'Solo el usuario administrador (admin@kadima.pe) puede hacer esto.' : m; };
const leer = k => { try { return localStorage.getItem('krh_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('krh_' + k, v); } catch (e) {} };
const usuarioActual = () => { try { return (window.parent && window.parent.KADIMA_USUARIO) || null; } catch (e) { return null; } };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

const AREAS = [['tienda', 'Tienda'], ['cocina', 'Cocina'], ['produccion', 'Producción'], ['almacen', 'Almacén'], ['administracion', 'Administración']];
const AREA_TXT = Object.fromEntries(AREAS);
const CONTRATOS = [['indeterminado', 'Indeterminado'], ['plazo_fijo', 'Plazo fijo'], ['part_time', 'Part time'], ['practicas', 'Prácticas'], ['locacion', 'Locación de servicios']];
const PENSION = ['ONP', 'AFP Integra', 'AFP Prima', 'AFP Profuturo', 'AFP Habitat', 'Ninguno'];
const ROLES = [
  ['admin', 'Administrador', 'Gestión completa: Panel, RH, anular ventas, autorizar descuentos.'],
  ['caja', 'Caja', 'Caja de tienda, Pedidos y CRM.'],
  ['mozo', 'Mozo / mesera', 'App de Mesas: toma pedidos y cobra en mesa.'],
  ['cocina', 'Cocina', 'Pantalla de cocina.'],
  ['digital', 'Digital', 'Caja digital (WhatsApp / pedidos en línea).'],
  ['almacen', 'Almacén', 'Logística: almacén, recetas y carga de costos.'],
  ['produccion', 'Producción', 'Logística: registro de producción.'],
];
const ROL_TXT = Object.fromEntries(ROLES.map(r => [r[0], r[1]]));
const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

const st = {
  tab: leer('tab') || 'trab', trab: [], usuarios: [], turnos: [],
  ft: { estado: 'activos', area: '', q: '' },
  verPin: new Set(),
  hor: { lunes: lunesDe(new Date()), area: leer('h_area') || '', pincel: leer('h_pincel') || 'TM', dias: {} },
};
function lunesDe(f) { const d = new Date(f); const w = d.getDay(); d.setDate(d.getDate() - (w === 0 ? 6 : w - 1)); d.setHours(0, 0, 0, 0); return d; }
const masDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

// ===================== SESIÓN =====================
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = /Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos.' : errTxt(error);
  iniciar();
});
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }
  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  const u = usuarioActual();
  if (EMBEBIDO && u && u.rol !== 'admin') { $('tabs').innerHTML = ''; $('main').innerHTML = '<div class="bloque vacio">🔒 RH solo lo puede abrir un usuario <b>Administrador</b>.<br>Cambia de usuario (PIN) en el menú de Gestión.</div>'; return; }
  $('main').innerHTML = '<div class="cargando">Cargando…</div>';
  try { await cargarTodo(); } catch (e) { $('main').innerHTML = `<div class="bloque error">${esc(errTxt(e))}</div>`; return; }
  irTab(st.tab);
}
async function cargarTodo() {
  const [t, u, tu] = await Promise.all([
    sb.from('trabajadores').select('*').order('nombre_corto'),
    sb.from('usuarios').select('id,nombre,rol,pin,activo,trabajador_id').order('nombre'),
    sb.from('turnos').select('*').order('orden').order('codigo'),
  ]);
  if (t.error) throw t.error; if (u.error) throw u.error; if (tu.error) throw tu.error;
  st.trab = t.data || []; st.usuarios = u.data || []; st.turnos = tu.data || [];
  if (!st.turnos.some(x => x.codigo === st.hor.pincel)) st.hor.pincel = st.turnos[0]?.codigo || '';
}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) irTab(b.dataset.tab); };
function irTab(t) {
  if (!['trab', 'acc', 'hor'].includes(t)) t = 'trab';
  st.tab = t; guardar('tab', t); $('main').onclick = null;
  [...$('tabs').children].forEach(b => b.classList.toggle('activa', b.dataset.tab === t));
  ({ trab: tabTrab, acc: tabAcc, hor: tabHor })[t]();
}
function abrirModal(html) { $('modal-caja').innerHTML = html; $('modal').classList.remove('oculto'); }
function cerrarModal() { $('modal').classList.add('oculto'); $('modal-caja').innerHTML = ''; }
$('modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });

// ===================== TRABAJADORES =====================
const nombreCompleto = t => [t.nombres, t.apellidos].filter(Boolean).join(' ');
const diasPara = f => f ? Math.round((deIso(f) - deIso(iso(new Date()))) / 86400000) : null;
function antiguedad(f) {
  if (!f) return '';
  const a = deIso(f), h = new Date(); let m = (h.getFullYear() - a.getFullYear()) * 12 + h.getMonth() - a.getMonth(); if (h.getDate() < a.getDate()) m--;
  if (m < 1) return 'menos de 1 mes'; const y = Math.floor(m / 12), r = m % 12;
  return [y ? y + (y === 1 ? ' año' : ' años') : '', r ? r + (r === 1 ? ' mes' : ' meses') : ''].filter(Boolean).join(' y ');
}
function tagContrato(t) {
  if (!t.activo) return `<span class="tag">Cesado ${fechaTxt(t.fecha_cese)}</span>`;
  const txt = (CONTRATOS.find(c => c[0] === t.tipo_contrato) || [, '—'])[1];
  const d = diasPara(t.fin_contrato);
  if (d == null) return `<span class="cod">${txt}</span>`;
  if (d < 0) return `<span class="tag mal">Venció hace ${-d} d</span>`;
  if (d <= 30) return `<span class="tag med">Vence en ${d} d</span>`;
  return `<span class="cod">${txt} · hasta ${fechaTxt(t.fin_contrato)}</span>`;
}
const accesoDe = t => st.usuarios.filter(u => u.trabajador_id === t.id && u.activo);

function tabTrab() {
  const f = st.ft;
  const act = st.trab.filter(t => t.activo);
  const plan = act.filter(t => t.en_planilla);
  const vence = act.filter(t => { const d = diasPara(t.fin_contrato); return d != null && d <= 30; });
  const sinAcc = act.filter(t => !accesoDe(t).length);
  const lista = st.trab.filter(t => (f.estado === 'todos' || (f.estado === 'activos') === t.activo) && (!f.area || t.area === f.area)
    && (!f.q || norm([t.codigo, t.nombre_corto, t.nombres, t.apellidos, t.num_doc, t.cargo].join(' ')).includes(norm(f.q))));
  $('main').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="t">Trabajadores activos</div><div class="v">${act.length}</div><div class="s">${plan.length} en planilla · ${act.length - plan.length} fuera</div></div>
      <div class="kpi"><div class="t">Sueldos básicos (planilla)</div><div class="v">${S(plan.reduce((a, t) => a + Number(t.sueldo_basico || 0), 0))}</div><div class="s">al mes, sin beneficios</div></div>
      <div class="kpi"><div class="t">Contratos por vencer</div><div class="v ${vence.length ? 'amb' : ''}" style="${vence.length ? 'color:var(--amb)' : ''}">${vence.length}</div><div class="s">en los próximos 30 días</div></div>
      <div class="kpi"><div class="t">Sin acceso (PIN)</div><div class="v">${sinAcc.length}</div><div class="s">${sinAcc.length ? esc(sinAcc.slice(0, 3).map(t => t.nombre_corto).join(', ')) + (sinAcc.length > 3 ? '…' : '') : 'todos tienen PIN'}</div></div>
    </div>
    <div class="bloque">
      <div class="barra-acc">
        <span class="chips" id="f-estado">${[['activos', 'Activos'], ['cesados', 'Cesados'], ['todos', 'Todos']].map(([k, n]) => `<button data-v="${k}" class="${f.estado === k ? 'activa' : ''}">${n}</button>`).join('')}</span>
        <span class="chips" id="f-area"><button data-v="" class="${!f.area ? 'activa' : ''}">Todas las áreas</button>${AREAS.map(([k, n]) => `<button data-v="${k}" class="${f.area === k ? 'activa' : ''}">${n}</button>`).join('')}</span>
        <input id="f-q" placeholder="Buscar nombre, DNI, cargo…" value="${esc(f.q)}" style="max-width:230px">
        <span class="esp"></span>
        <button class="btn sec peq" id="b-plant">⬇ Plantilla Excel</button>
        <label class="btn sec peq" style="cursor:pointer">⬆ Subir Excel<input type="file" id="b-subir" accept=".xlsx,.xls,.csv" class="oculto"></label>

function fechaExcel(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  if (v instanceof Date) return iso(v);
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  return undefined;
}
const siNo = v => { const t = norm(v); return t === 'si' || t === 'sí' || t === 'x' || t === '1' || t === 'true'; };
async function subirTrab(file) {
  let filas;
  try { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true }); }
  catch (e) { return alert('No se pudo leer el archivo: ' + e.message); }
  const col = (r, nom) => { const k = Object.keys(r).find(x => norm(x) === norm(nom)); return k ? r[k] : ''; };
  const nuevos = [], cambios = [], errores = [];
  filas.forEach((r, i) => {
    const o = {}; let err = '';
    COLS_T.forEach(([nom, k, tp]) => {
      const v = col(r, nom); if (v === '' || v == null) return;   // vacío: no se toca (al crear, toma el valor por defecto)
      if (tp === 'f') { const f = fechaExcel(v); if (f === undefined) err = `${nom} no válida`; else o[k] = f; }
      else if (tp === 'b') o[k] = siNo(v);
      else if (tp === 'n') { const x = Number(String(v).replace(',', '.')); if (isNaN(x)) err = `${nom} no es número`; else o[k] = x; }
      else if (tp === 'area') { const a = AREAS.find(([kk, n]) => norm(n) === norm(v) || kk === norm(v)); if (!a) err = `Área "${v}" no existe`; else o[k] = a[0]; }
      else if (tp === 'contrato') { const a = CONTRATOS.find(([kk, n]) => norm(n) === norm(v) || kk === norm(v) || norm(n).startsWith(norm(v))); if (!a) err = `Tipo de contrato "${v}" no existe`; else o[k] = a[0]; }
      else if (tp === 'pension') { const a = PENSION.find(p => norm(p) === norm(v) || norm(p) === 'afp ' + norm(v)); if (!a) err = `Pensión "${v}" no existe`; else o[k] = a; }
      else if (tp === 'comision') o[k] = norm(v).startsWith('m') ? 'mixta' : 'flujo';
      else o[k] = String(v).trim();
    });
    if (!o.nombre_corto && !o.nombres) return;   // fila vacía
    if (!o.nombre_corto || !o.nombres) err = err || 'Falta nombre corto o nombres';
    if (o.tipo_doc) o.tipo_doc = o.tipo_doc.toUpperCase();
    if (err) return errores.push(`Fila ${i + 2}: ${err}`);
    const ex = st.trab.find(t => (o.codigo && t.codigo === o.codigo.toUpperCase()) || (o.num_doc && t.num_doc === o.num_doc));
    if (ex) cambios.push({ id: ex.id, nombre: ex.nombre_corto, o }); else { if (!o.codigo) delete o.codigo; nuevos.push(o); }
  });

async function importarHorario(file) {
  let filas;
  try { const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true }); }
  catch (e) { return alert('No se pudo leer el archivo: ' + e.message); }
  const col = (r, ...ns) => { const k = Object.keys(r).find(x => ns.includes(norm(x))); return k ? r[k] : ''; };
  const porNombre = {}; st.trab.forEach(t => { porNombre[norm(t.nombre_corto)] = t; porNombre[norm(t.nombres)] = porNombre[norm(t.nombres)] || t; porNombre[norm(t.codigo)] = t; });
  const ok = new Map(), sinPersona = new Set(), sinTurno = new Set(); let malas = 0;
  filas.forEach(r => {
    const f = fechaExcel(col(r, 'fecha')), nom = String(col(r, 'trabajador', 'nombre', 'colaboradora', 'codigo', 'código')).trim(), est = col(r, 'estado', 'turno');
    if (!nom && !f) return;
    if (!f) { malas++; return; }
    const t = porNombre[norm(nom)]; if (!t) { sinPersona.add(nom); return; }
    const c = codigoTurno(est); if (c === null) return; if (c === undefined) { sinTurno.add(String(est)); return; }
    ok.set(t.id + '|' + f, { trabajador_id: t.id, fecha: f, turno: c, actualizado_en: new Date().toISOString() });
  });
  const lista = [...ok.values()];
  const avisos = [sinPersona.size ? `Nombres que no están en Trabajadores (se saltan): ${[...sinPersona].slice(0, 12).join(', ')}` : '', sinTurno.size ? `Turnos que no reconozco (se saltan): ${[...sinTurno].slice(0, 12).join(', ')}` : '', malas ? `${malas} fila(s) sin fecha válida` : ''].filter(Boolean).join('\n');
  if (!lista.length) return alert('No hay nada para importar.\n\nEl archivo debe tener las columnas Fecha, Trabajador y Estado.' + (avisos ? '\n\n' + avisos : ''));
  const fs = lista.map(x => x.fecha).sort();
  if (!confirm(`Se van a cargar ${lista.length} turnos, del ${fechaTxt(fs[0])} al ${fechaTxt(fs[fs.length - 1])}. Si un día ya tenía turno, se reemplaza.${avisos ? '\n\n' + avisos : ''}\n\n¿Continuar?`)) return;
  for (let i = 0; i < lista.length; i += 500) {
    const r = await sb.from('horario_dias').upsert(lista.slice(i, i + 500), { onConflict: 'trabajador_id,fecha' });
    if (r.error) return alert(`Se cargaron ${i} y falló el resto: ${errTxt(r.error)}`);
  }
  toast(`✓ ${lista.length} turnos importados`); tabHor();
}
async function guardarTurno(cod) {
  const tr = $('main').querySelector(`tr[data-c="${CSS.escape(cod)}"]`); const g = k => tr.querySelector(`[data-k="${k}"]`);
  const datos = { nombre: g('nombre').value.trim() || cod, tipo: g('tipo').value, hora_inicio: g('hora_inicio').value || null, hora_fin: g('hora_fin').value || null, color: g('color').value, activo: g('activo').checked };
  const r = await sb.from('turnos').update(datos).eq('codigo', cod);
  if (r.error) return alert(errTxt(r.error));
  await cargarTodo(); toast('✓ Turno guardado'); pintarHor();
}
async function nuevoTurno() {
  const c = $('nt-c').value.trim().toUpperCase(), n = $('nt-n').value.trim();
  if (!/^[A-Z0-9]{1,4}$/.test(c) || !n) return alert('Pon un código corto (hasta 4 letras o números) y un nombre.');
  if (turnoDe(c)) return alert('Ese código ya existe.');
  const r = await sb.from('turnos').insert({ codigo: c, nombre: n, tipo: 'trabajo', orden: 50 });
  if (r.error) return alert(errTxt(r.error));
  await cargarTodo(); toast('✓ Turno agregado'); pintarHor();
}
