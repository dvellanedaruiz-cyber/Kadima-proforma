<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comanda Kadima</title>
<style>
  @page { size: 80mm auto; margin: 0; }

  * { box-sizing: border-box; }

  body {
    width: 76mm;
    margin: 0 auto;
    padding: 3mm 2mm;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.35;
    color: #000;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #000;
    padding-bottom: 2mm;
    margin-bottom: 2mm;
  }
  .header .codigo { font-size: 16px; font-weight: 700; }
  .header .hora { font-size: 13px; font-weight: 700; }

  .cliente-row { font-weight: 700; margin-bottom: 1mm; }
  .fecha-row { margin-bottom: 2mm; }

  .divider { border-top: 1px dashed #000; margin: 2mm 0; }

  .label { font-weight: 700; text-transform: uppercase; margin-bottom: 1mm; }

  table.productos { width: 100%; border-collapse: collapse; margin-bottom: 1mm; }
  table.productos td { vertical-align: top; padding: 0.5mm 0; }
  table.productos td.cant { width: 8mm; font-weight: 700; }
  table.productos td.desc { padding-left: 1mm; }
  table.productos td.desc .desc-sub { font-size: 10px; color: #333; }

  .obs-text { white-space: pre-wrap; word-break: break-word; }

  .totales { margin-top: 2mm; border-top: 2px solid #000; padding-top: 2mm; }
  .totales-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 0.5mm; }
  .totales-row.saldo { font-weight: 700; font-size: 13px; }

  .footer-note { text-align: center; margin-top: 3mm; font-size: 10px; color: #333; }

  @media print {
    body { padding: 0 2mm; }
  }
</style>
</head>
<body>

  <div class="header">
    <span class="codigo" id="codigo">N° ----</span>
    <span class="hora" id="hora">--:--</span>
  </div>

  <div class="cliente-row" id="cliente">Cliente: -</div>
  <div class="fecha-row" id="fecha">Fecha entrega: -</div>

  <div class="divider"></div>

  <div class="label">Producto</div>
  <table class="productos" id="tabla-productos"></table>

  <div id="obs-block" style="display:none;">
    <div class="divider"></div>
    <div class="label">Observaciones</div>
    <div class="obs-text" id="observaciones"></div>
  </div>

  <div class="totales">
    <div class="totales-row"><span>Total</span><span id="total">S/ 0</span></div>
    <div class="totales-row"><span>Adelanto</span><span id="adelanto">S/ 0</span></div>
    <div class="totales-row saldo"><span>SALDO</span><span id="saldo">S/ 0</span></div>
  </div>

  <div class="footer-note">Kadima Pastelería &amp; Panadería</div>

<script>
  function qp(name) {
    const v = new URLSearchParams(window.location.search).get(name);
    return v ? decodeURIComponent(v) : '';
  }

  document.getElementById('codigo').textContent = 'N° ' + (qp('codigo') || '----');
  document.getElementById('hora').textContent = qp('hora') || '--:--';
  document.getElementById('cliente').textContent =
    'Cliente: ' + (qp('cliente') || '-') + (qp('telefono') ? '  ·  Tel: ' + qp('telefono') : '');
  document.getElementById('fecha').textContent = 'Fecha entrega: ' + (qp('fecha') || '-');

  // Productos viene como JSON: [{"Producto":"...","Descripcion":"...","Cantidad":1}, ...]
  let productos = [];
  try { productos = JSON.parse(qp('productos') || '[]'); } catch (e) { productos = []; }

  const tabla = document.getElementById('tabla-productos');
  productos.forEach(p => {
    const tr = document.createElement('tr');
    const cantidad = p.Cantidad ?? p.cantidad ?? '';
    const nombre = p.Producto ?? p.producto ?? '';
    const desc = p.Descripcion ?? p.descripcion ?? '';
    tr.innerHTML =
      '<td class="cant">' + cantidad + '</td>' +
      '<td class="desc"><div>' + nombre + '</div>' +
      (desc ? '<div class="desc-sub">' + desc + '</div>' : '') +
      '</td>';
    tabla.appendChild(tr);
  });

  const obs = qp('obs');
  if (obs) {
    document.getElementById('obs-block').style.display = 'block';
    document.getElementById('observaciones').textContent = obs;
  }

  document.getElementById('total').textContent = 'S/ ' + (qp('total') || '0');
  document.getElementById('adelanto').textContent = 'S/ ' + (qp('adelanto') || '0');
  document.getElementById('saldo').textContent = 'S/ ' + (qp('saldo') || '0');

  window.onload = function () {
    setTimeout(function () { window.print(); }, 300);
  };
</script>

</body>
</html>
