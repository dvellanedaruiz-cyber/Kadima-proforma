<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadima Almacén</title>
<meta name="theme-color" content="#8B0000">
<link rel="manifest" href="almacen-manifest.webmanifest">
<link rel="icon" href="pos-icon-192.png">
<style>
.switch{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--gris);cursor:pointer;user-select:none}
.switch input{display:none}.switch i{width:34px;height:20px;border-radius:20px;background:#ccc;position:relative;transition:.2s;flex-shrink:0}
.switch i:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--rojo)}.switch input:checked+i:after{left:16px}
.lote{display:inline-block;border:1px solid;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;cursor:pointer;white-space:nowrap}
.punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.resumen-ant{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}.resumen-ant b{font-size:15px}
.vu td input{width:80px;text-align:right}
:root{--rojo:#8B0000;--fondo:#f6f4f2;--borde:#e3dfdb;--gris:#6b6b6b;--texto:#1f1f1f;--ok:#1e7d3a;--aviso:#b26a00;--mal:#b00020}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--borde);border-radius:8px;background:#fff;width:100%}
.oculto{display:none!important}
.btn{background:var(--rojo);color:#fff;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn-sec{background:#fff;color:var(--rojo);border:1.5px solid var(--rojo);padding:7px 12px;font-weight:600}
.btn-mini{background:var(--fondo);color:var(--texto);padding:5px 10px;font-size:13px;font-weight:600}
.error{color:var(--mal);min-height:18px;margin-top:8px;white-space:pre-line}
.okmsg{color:var(--ok);min-height:18px;margin-top:8px;font-weight:600}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.tarjeta{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:24px;width:100%;max-width:380px}
.marca{color:var(--rojo);font-weight:800;font-size:22px;margin:0}.sub{color:var(--gris);margin:4px 0 16px}
.pin-puntos{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.pin-puntos span{width:14px;height:14px;border-radius:50%;border:2px solid var(--rojo)}.pin-puntos span.lleno{background:var(--rojo)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teclado button{padding:16px;font-size:20px;background:var(--fondo);font-weight:600}

.barra{background:var(--rojo);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.barra b{font-size:18px}.barra select{width:auto;min-width:200px;font-weight:600;padding:7px 10px}
.barra .usr{margin-left:auto;font-size:13px;opacity:.9}
.barra button{background:rgba(255,255,255,.15);color:#fff;padding:7px 12px;font-weight:600}
.tabs{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--borde);background:#fff;position:sticky;top:52px;z-index:4}
.tabs button{background:none;padding:10px 14px;font-weight:600;color:var(--gris);border-radius:8px 8px 0 0;border-bottom:3px solid transparent}
.tabs button.activa{color:var(--rojo);border-bottom-color:var(--rojo)}
.tabs .num{background:var(--rojo);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
main{padding:16px;max-width:1200px;margin:0 auto}
.bloque{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.bloque h3{margin:0 0 12px;font-size:15px;color:var(--rojo)}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fila>.campo{flex:1;min-width:150px}
.campo label{display:block;font-size:12px;color:var(--gris);margin-bottom:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--fondo);padding:6px 12px;font-size:13px;font-weight:600;color:var(--gris)}
.chips button.activa{background:var(--rojo);color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff}
.t th{text-align:left;font-size:12px;color:var(--gris);padding:8px;border-bottom:1px solid var(--borde);background:#faf8f6;position:sticky;top:0}
.t td{padding:8px;border-bottom:1px solid #f3f0ed;vertical-align:middle}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.clic{cursor:pointer}.t tr.clic:hover td{background:#fbf9f7}
.neg{color:var(--mal);font-weight:700}.pos{color:var(--ok)}
.tipo{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:#eee;color:#555;white-space:nowrap}
.tipo.insumo{background:#e8f0fb;color:#1f4f99}.tipo.intermedio{background:#f3e8fb;color:#6b2b99}.tipo.producto_terminado{background:#fff1e0;color:#9a5300}
.tipo.paqueteria{background:#e9f5ef;color:#1e6b44}.tipo.mercaderia{background:#fdeaea;color:#8b1a1a}.tipo.plato{background:#fffbe0;color:#7a6500}
.total{display:flex;justify-content:flex-end;gap:20px;margin-top:10px;font-size:15px}
.buscador{position:relative}
.resultados{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--borde);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:8;max-height:280px;overflow:auto}
.resultados div{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.resultados div:hover,.resultados div.foco{background:#fff5f5}
.resultados small{color:#999}
.lineas .ln{display:grid;grid-template-columns:1fr 130px 150px 110px 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--borde)}
.lineas.sin-precio .ln{grid-template-columns:1fr 150px 130px 32px}
.ln .nom{font-weight:600}.ln .nom small{display:block;color:var(--gris);font-weight:400}
.ln .x{background:none;color:var(--mal);font-size:18px}
.ln .u{font-size:12px;color:var(--gris)}
.estado{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.estado.enviado{background:#fff4d6;color:#8a5a00}.estado.recibido{background:#e3f5e9;color:var(--ok)}.estado.anulado,.estado.anulada{background:#eee;color:#999}
.estado.registrada{background:#e3f5e9;color:var(--ok)}
.vacio{color:var(--gris);text-align:center;padding:24px}
.ayuda{color:var(--gris);font-size:13px;margin:-4px 0 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .tarjeta{max-width:560px;max-height:92vh;overflow:auto}
.conteo-in{width:110px;text-align:right}
.res{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px}
.res.consumo{background:#e8f0fb;color:#1f4f99}.res.faltante{background:#fde2e2;color:var(--mal)}.res.sobrante{background:#fff4d6;color:#8a5a00}.res.cuadra{background:#e3f5e9;color:var(--ok)}
@media (max-width:760px){.lineas .ln,.lineas.sin-precio .ln{grid-template-columns:1fr 1fr 32px}.ln .nom{grid-column:1/-1}.barra select{min-width:0;width:100%}.tabs{top:96px}}
.embebido #b-salir,.embebido #b-usr,.embebido .barra>b{display:none!important}
</style>
</head>
<body>

<section id="v-login" class="centro oculto">
  <form class="tarjeta" id="f-login">
    <p class="marca">KADIMA</p><p class="sub">Almacén y Producción · iniciar sesión</p>
    <input id="l-email" type="email" value="caja@kadima.pe" required style="margin-bottom:10px">
    <input id="l-pass" type="password" placeholder="Contraseña" required style="margin-bottom:10px">
    <button class="btn" style="width:100%">Ingresar</button>
    <div class="error" id="l-error"></div>
  </form>
</section>

<section id="v-pin" class="centro oculto">
  <div class="tarjeta" style="max-width:340px">
    <p class="marca">KADIMA</p><p class="sub">Almacén · Ingresa tu PIN</p>
    <div class="pin-puntos" id="pin-puntos"></div>
    <div class="teclado" id="teclado"></div>
    <div class="error" id="pin-error" style="text-align:center"></div>
  </div>
</section>

<section id="v-app" class="oculto">
  <div class="barra">
    <b>KADIMA</b>
    <select id="b-almacen" title="Almacén"></select>
    <span class="usr" id="b-usr"></span>
    <button id="b-salir">Cambiar usuario</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</section>

<div class="modal oculto" id="modal"><div class="tarjeta" id="modal-c"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
// dentro de "Kadima Gestión" usa la sesión de Gestión (no se mezcla con la caja)
const EMBEBIDO = window.self !== window.top;
if (EMBEBIDO) document.documentElement.classList.add('embebido');
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, EMBEBIDO ? { auth: { storageKey: (() => { try { return window.parent.KADIMA_AUTH_KEY || 'kadima-gestion-auth'; } catch (e) { return 'kadima-gestion-auth'; } })() } } : undefined);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const S = n => n === null || n === undefined ? '—' : 'S/ ' + Number(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const C = (n, u) => { const v = Number(n || 0); const t = v.toLocaleString('es-PE', { maximumFractionDigits: 3 }); return u ? `${t} ${UNI[u] || ''}` : t; };
const UNI = { Kilo: 'kg', Litro: 'L', Unidad: 'und' };
const TIPO = { insumo: 'Insumo', intermedio: 'Base', producto_terminado: 'Terminado', paqueteria: 'Paquetería', mercaderia: 'Mercadería', plato: 'Plato', servicio: 'Servicio' };
const LIMA = { timeZone: 'America/Lima' };
const fecha = iso => new Date(iso).toLocaleDateString('es-PE', { ...LIMA, day: '2-digit', month: '2-digit', year: 'numeric' });
const fh = iso => new Date(iso).toLocaleString('es-PE', { ...LIMA, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const hoy = () => new Date().toLocaleDateString('en-CA', LIMA);
const errTxt = e => { const m = (e && (e.message || e.error_description)) || String(e); return /fetch|network/i.test(m) ? 'Sin conexión a internet.' : /Invalid login/i.test(m) ? 'Correo o contraseña incorrectos.' : m; };
const guardar = (k, v) => { try { localStorage.setItem('kadima_' + k, JSON.stringify(v)); } catch (e) {} };
const leer = k => { try { return JSON.parse(localStorage.getItem('kadima_' + k)); } catch (e) { return null; } };

const st = { usuario: null, almacenes: [], alm: null, productos: [], tab: 'stock', filtroTipo: '', pendientes: 0 };

function vista(id) { ['v-login','v-pin','v-app'].forEach(v => $(v).classList.toggle('oculto', v !== id)); }

// ===== Acceso =====
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = errTxt(error);
  iniciar();
});
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return vista('v-login');
  pedirPin();
}
let pin = '';
function pedirPin() {
  // en Gestión el PIN se pide una sola vez en la pantalla principal
  try { if (EMBEBIDO && window.parent.KADIMA_USUARIO) { st.usuario = window.parent.KADIMA_USUARIO; return abrirApp(); } } catch (e) {}
  pin = ''; vista('v-pin'); $('pin-error').textContent = ''; dibujarPin(); }
function dibujarPin() { $('pin-puntos').innerHTML = [0,1,2,3].map(i => `<span class="${i < pin.length ? 'lleno' : ''}"></span>`).join(''); }
$('teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(t => `<button data-t="${t}">${t}</button>`).join('');
$('teclado').onclick = e => { const t = e.target.dataset.t; if (!t) return; if (t === '⌫') pin = pin.slice(0, -1); else if (t === 'OK') return validarPin(); else if (pin.length < 6) pin += t; dibujarPin(); if (pin.length === 4) validarPin(); };
document.addEventListener('keydown', e => {
  if ($('v-pin').classList.contains('oculto')) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 6) { pin += e.key; dibujarPin(); if (pin.length === 4) validarPin(); }
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); dibujarPin(); }
});
async function validarPin() {
  const { data, error } = await sb.from('usuarios').select('id,nombre,rol,pin').eq('activo', true);
  if (error) { $('pin-error').textContent = errTxt(error); pin = ''; return dibujarPin(); }
  const u = data.find(x => x.pin === pin);
  if (!u) { $('pin-error').textContent = 'PIN incorrecto'; pin = ''; return dibujarPin(); }
  st.usuario = u; abrirApp();
}
$('b-salir').onclick = pedirPin;

async function abrirApp() {
  vista('v-app');
  $('b-usr').textContent = st.usuario.nombre;
  const [a, p] = await Promise.all([
    sb.from('almacenes').select('*, sedes(nombre)').eq('activo', true).order('id'),
    sb.from('productos').select('id,codigo,nombre,tipo_item,unidad_medida,producto_padre_id,porciones_por_unidad,activo').eq('activo', true).order('nombre')
  ]);
  st.almacenes = a.data || []; st.productos = p.data || [];
  $('b-almacen').innerHTML = st.almacenes.map(x => `<option value="${x.id}">${esc(x.nombre)} · ${esc(x.sedes ? x.sedes.nombre : '')}</option>`).join('');
  const previo = leer('almacen_sel');
  st.alm = st.almacenes.find(x => x.id === previo) || st.almacenes[0];
  $('b-almacen').value = st.alm.id;
  cambiarAlmacen();
}
$('b-almacen').onchange = () => { st.alm = st.almacenes.find(x => x.id === Number($('b-almacen').value)); guardar('almacen_sel', st.alm.id); cambiarAlmacen(); };

function tabsDisponibles() {
  const a = st.alm, t = [['stock', 'Stock']];
  if (a.permite_compra) t.push(['compra', 'Ingreso por compra']);
  t.push(['traslado', 'Traslados']);
  if (a.permite_produccion) t.push(['produccion', 'Producción']);
  t.push(['merma', 'Merma']);
  if (a.tipo === 'venta') t.push(['porcionar', 'Porcionar']);
  t.push(['conteo', 'Conteo / cierre'], ['kardex', 'Kardex']);
  if (['admin','almacen'].includes(st.usuario.rol)) t.push(['inicial', 'Inventario inicial'], ['vida', 'Vida útil']);
  return t;
}
async function cambiarAlmacen() {
  const { count } = await sb.from('traslados').select('id', { count: 'exact', head: true }).eq('almacen_destino_id', st.alm.id).eq('estado', 'enviado');
  st.pendientes = count || 0;
  const t = tabsDisponibles();
  if (!t.some(x => x[0] === st.tab)) st.tab = 'stock';
  $('tabs').innerHTML = t.map(([k, n]) => `<button data-tab="${k}" class="${k === st.tab ? 'activa' : ''}">${n}${k === 'traslado' && st.pendientes ? `<span class="num">${st.pendientes}</span>` : ''}</button>`).join('');
  abrirTab(st.tab);
}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; st.tab = b.dataset.tab; [...$('tabs').children].forEach(x => x.classList.toggle('activa', x === b)); abrirTab(st.tab); };
function abrirTab(t) { ({ stock: tabStock, compra: tabCompra, traslado: tabTraslado, produccion: tabProduccion, merma: tabMerma, porcionar: tabPorcionar, conteo: tabConteo, kardex: tabKardex, inicial: tabInicial, vida: tabVida })[t](); }

// ===== Buscador de productos + líneas reutilizable =====
// opciones: { tipos: [...], precio: bool, stock: bool }
function editorLineas(cont, op) {
  const lineas = [];
  cont.innerHTML = `<div class="buscador"><input class="bq" placeholder="Buscar producto por nombre o código (Enter agrega)" autocomplete="off"><div class="resultados oculto"></div></div>
    <div class="lineas ${op.precio ? '' : 'sin-precio'}"></div>`;
  const bq = cont.querySelector('.bq'), res = cont.querySelector('.resultados'), lis = cont.querySelector('.lineas');
  let encontrados = [], foco = 0;
  const stockDe = id => op.stock ? (op.stock[id] ?? 0) : null;
  bq.oninput = () => {
    const q = bq.value.trim().toLowerCase();
    if (q.length < 2) return res.classList.add('oculto');
    encontrados = st.productos.filter(p => (!op.tipos || op.tipos.includes(p.tipo_item)) && (p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q))).slice(0, 15);
    foco = 0;
    res.innerHTML = encontrados.map((p, i) => `<div data-p="${p.id}" class="${i ? '' : 'foco'}"><span>${esc(p.nombre)} <small>${p.codigo} · ${TIPO[p.tipo_item]}</small></span>${op.stock ? `<small>stock ${C(stockDe(p.id), p.unidad_medida)}</small>` : `<small>${UNI[p.unidad_medida]}</small>`}</div>`).join('') || '<div>Sin resultados</div>';
    res.classList.remove('oculto');
  };
  bq.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); foco = Math.max(0, Math.min(encontrados.length - 1, foco + (e.key === 'ArrowDown' ? 1 : -1))); [...res.children].forEach((d, i) => d.classList.toggle('foco', i === foco)); }
    if (e.key === 'Enter' && encontrados[foco]) { e.preventDefault(); agregar(encontrados[foco].id); }
    if (e.key === 'Escape') res.classList.add('oculto');
  };
  res.onclick = e => { const d = e.target.closest('[data-p]'); if (d) agregar(Number(d.dataset.p)); };
  function agregar(id) {
    leerDom();
    if (lineas.some(l => l.producto_id === id)) { bq.value = ''; res.classList.add('oculto'); return; }
    const p = st.productos.find(x => x.id === id);
    lineas.push({ producto_id: id, nombre: p.nombre, codigo: p.codigo, unidad: p.unidad_medida, cantidad: '', importe: '' });
    bq.value = ''; res.classList.add('oculto'); pintar();
    const ins = lis.querySelectorAll('.l-cant'); ins[ins.length - 1].focus();
  }
  function pintar() {
    lis.innerHTML = lineas.map((l, i) => `<div class="ln">
      <div class="nom">${esc(l.nombre)}<small>${l.codigo}${op.stock ? ' · stock ' + C(stockDe(l.producto_id), l.unidad) : ''}</small></div>
      <div><input class="l-cant" type="number" step="0.001" min="0" placeholder="Cantidad" value="${l.cantidad}"><span class="u">en ${UNI[l.unidad]}</span></div>
      ${op.precio ? `<div><input class="l-imp" type="number" step="0.0001" min="0" placeholder="${op.costoUnit ? 'Costo unit. sin IGV' : 'Importe con IGV'}" value="${l.importe}"><span class="u">${op.costoUnit ? 'por ' + UNI[l.unidad] + ' (sin IGV)' : 'total de la línea'}</span></div>` : ''}
      <div class="u l-pu" style="text-align:right">${op.precio ? precioUnit(l) : ''}</div>
      <button class="x" data-q="${i}" title="Quitar">✕</button></div>`).join('') || '<div class="vacio">Busca y agrega productos.</div>';
    if (op.onCambio) op.onCambio(lineas);
  }
  const precioUnit = l => op.costoUnit ? (Number(l.cantidad) > 0 && Number(l.importe) > 0 ? `valor ${S(Number(l.importe) * Number(l.cantidad))}` : '')
    : Number(l.cantidad) > 0 && Number(l.importe) > 0 ? `${S(Number(l.importe) / Number(l.cantidad))} / ${UNI[l.unidad]}` : '';
  function leerDom() {
    const c = lis.querySelectorAll('.l-cant'), m = lis.querySelectorAll('.l-imp'), pu = lis.querySelectorAll('.l-pu');
    lineas.forEach((l, i) => { if (!c[i]) return; l.cantidad = c[i].value; if (m[i]) { l.importe = m[i].value; pu[i].textContent = precioUnit(l); } });
    if (op.onCambio) op.onCambio(lineas);
  }
  lis.oninput = leerDom;
  lis.onclick = e => { const q = e.target.dataset.q; if (q !== undefined) { leerDom(); lineas.splice(Number(q), 1); pintar(); } };
  pintar();
  return { lineas: () => { leerDom(); return lineas; }, limpiar: () => { lineas.length = 0; pintar(); } };
}
async function stockMapa(almId) {
  const { data } = await sb.from('stock_actual').select('producto_id,cantidad').eq('almacen_id', almId);
  const m = {}; (data || []).forEach(r => m[r.producto_id] = Number(r.cantidad)); return m;
}
const tipoTag = t => `<span class="tipo ${t}">${TIPO[t] || t}</span>`;

// ===== SEMÁFORO DE ANTIGÜEDAD =====
const ORDEN_ANT = { sin_config: 0, verde: 1, amarillo: 2, rojo: 3 };
const diasTxt = d => d == null ? '+180 d' : d === 0 ? 'hoy' : d === 1 ? '1 día' : d + ' días';
// el color va cambiando con los días: verde (nuevo) → amarillo (día de alerta) → rojo (día límite)
function colorAnt(c) {
  if (c.estado === 'sin_config') return { c: '#8a8a8a', f: '#f2f2f2' };
  if (c.dias == null) return { c: 'hsl(0,75%,40%)', f: 'hsla(0,75%,45%,.12)' };
  const a = c.dias_alerta ?? Math.max(1, Math.round((c.dias_limite || 2) / 2)), l = Math.max(c.dias_limite ?? a * 2, a + 1);
  const h = c.dias <= a ? 130 - 85 * (c.dias / a) : Math.max(0, 45 - 45 * ((c.dias - a) / (l - a)));
  return { c: `hsl(${h.toFixed(0)},75%,${h > 60 ? 32 : 38}%)`, f: `hsla(${h.toFixed(0)},75%,45%,.12)` };
}
function revisarLote(r, c) {
  const u = r.unidad_medida, k = colorAnt(c);
  const lim = c.dias_limite != null ? ` · límite ${c.dias_limite} d` : '', al = c.dias_alerta != null ? `alerta ${c.dias_alerta} d` : '';
  modal(`<h3 style="margin-top:0">${esc(r.nombre)}</h3>
    <p><span class="lote" style="color:${k.c};border-color:${k.c};background:${k.f};cursor:default">${C(c.cantidad, u)} · ${diasTxt(c.dias)}</span></p>
    <p class="ayuda">${c.ingreso ? 'Ingresó el ' + fh(c.ingreso) : 'No hay ingreso registrado en los últimos 180 días'}${al || lim ? ' · ' + al + lim : ''}.<br>Revisa estas unidades. Si ya no están óptimas, dalas de baja.</p>
    <div class="fila"><div class="campo" style="max-width:150px"><label>Cantidad a desechar</label><input id="rl-cant" type="number" step="0.001" min="0" value="${Number(c.cantidad)}"></div>
    <div class="campo"><label>Motivo</label><input id="rl-mot" value="Vencido"></div></div>
    <div class="error" id="rl-err"></div>
    <div class="fila" style="margin-top:12px;justify-content:flex-end"><button class="btn-sec" id="rl-ok2">✓ Sigue óptimo</button><button class="btn" id="rl-ok">Registrar merma</button></div>`);
  $('rl-ok2').onclick = cerrarModal;
  $('rl-ok').onclick = async () => {
    const n = Number($('rl-cant').value);
    if (!(n > 0)) return $('rl-err').textContent = 'Ingresa la cantidad.';
    $('rl-ok').disabled = true;
    const { error } = await sb.rpc('registrar_merma', { p: { almacen_id: st.alm.id, motivo: $('rl-mot').value || 'Vencido', usuario_id: st.usuario.id, items: [{ producto_id: r.producto_id, cantidad: n }] } });
    $('rl-ok').disabled = false;
    if (error) return $('rl-err').textContent = errTxt(error);
    cerrarModal(); tabStock();
  };
}

    <td><span class="estado ${t.estado}">${t.estado}</span>${t.recibido_en ? `<br><small>${fh(t.recibido_en)} ${esc(t.recibido_por || '')}</small>` : ''}</td><td>${t.estado === 'enviado' ? `<button class="btn-mini" data-ant="${t.id}">Anular</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="vacio">Aún no hay envíos.</div>';

  $('p-bq').onkeydown = e => {

    if (e.key === 'Enter' && enc[foco]) { e.preventDefault(); elegir(enc[foco].id); }

  $('p-cant').onkeydown = e => { if (e.key === 'Enter') $('p-ok').click(); };

async function listarLotes() {
  const d = $('p-dia').value;
  const { data } = await sb.from('v_lotes').select('*').eq('almacen_id', st.alm.id).gte('fecha', d + 'T00:00:00-05:00').lte('fecha', d + 'T23:59:59-05:00').order('id', { ascending: false });
  $('p-lista').className = '';
  const tot = {};
  (data || []).filter(l => !l.anulado).forEach(l => { tot[l.producto] = tot[l.producto] || { c: 0, u: l.unidad_medida }; tot[l.producto].c += Number(l.cantidad); });
  $('p-lista').innerHTML = data && data.length ? `<table class="t"><tr><th>Hora</th><th>Producto</th><th>Tipo</th><th class="n">Cantidad</th><th>Nota</th><th>Registró</th><th></th></tr>
    ${data.map(l => `<tr style="${l.anulado ? 'color:#aaa;text-decoration:line-through' : ''}"><td>${new Date(l.fecha).toLocaleTimeString('es-PE', { ...LIMA, hour: '2-digit', minute: '2-digit' })}</td><td>${esc(l.producto)}</td><td>${tipoTag(l.tipo_item)}</td>
      <td class="n"><b>${C(l.cantidad, l.unidad_medida)}</b>${l.actualizado_en && !l.anulado ? ' <small style="color:var(--aviso)">editado</small>' : ''}</td><td>${esc(l.nota || '')}</td><td>${esc(l.usuario || '')}</td>
      <td>${l.anulado ? '' : `<button class="btn-mini" data-ed="${l.id}" data-c="${l.cantidad}">Editar</button> <button class="btn-mini" data-an="${l.id}">Anular</button>`}</td></tr>`).join('')}</table>
    <p style="margin:12px 0 0"><b>Total del día:</b> ${Object.entries(tot).map(([n, v]) => `${C(v.c, v.u)} ${esc(n)}`).join(' · ')}</p>` : '<div class="vacio">No hay lotes registrados ese día.</div>';
  $('p-lista').onclick = async e => {
    const ed = e.target.dataset.ed, an = e.target.dataset.an;
    let id, nueva;
    if (ed) { const v = prompt('Nueva cantidad del lote:', e.target.dataset.c); if (v === null) return; nueva = Number(v); id = ed; if (!(nueva >= 0)) return alert('Cantidad no válida'); }

    else return;
    const { error } = await sb.rpc('editar_lote', { p_lote: Number(id), p_cantidad: nueva, p_usuario: st.usuario.id });
    if (error) return alert(errTxt(error)); listarLotes();
  };
}

  $('k-ok').onclick = async () => {
    $('k-error').textContent = ''; $('k-okmsg').textContent = '';
    const items = filas.filter(r => r.contado !== '').map(r => ({ producto_id: r.producto_id, cantidad_contada: Number(r.contado) }));
    if (!items.length) return $('k-error').textContent = 'No contaste ningún producto.';
    if (!confirm(`Se cerrará el conteo de ${items.length} producto(s) y se registrarán las diferencias. ¿Continuar?`)) return;
    $('k-ok').disabled = true;
    const { data, error } = await sb.rpc('cerrar_conteo', { p: { almacen_id: st.alm.id, usuario_id: st.usuario.id, items } });
    $('k-ok').disabled = false;
    if (error) return $('k-error').textContent = errTxt(error);
    await tabConteo();
    $('k-okmsg').textContent = `✓ Conteo cerrado: ${data.consumos} consumo(s) y ${data.ajustes} ajuste(s) registrados.`;
  };
  $('k-dia').onchange = historialConteo;
  pintar(); historialConteo();
}
async function historialConteo() {
  const { data } = await sb.from('v_conteos').select('*').eq('almacen_id', st.alm.id).eq('fecha', $('k-dia').value).order('producto');
  $('k-hist').className = '';
  if (!data || !data.length) return $('k-hist').innerHTML = '<div class="vacio">Sin conteos ese día.</div>';
  const suma = t => data.filter(r => r.resultado === t).reduce((a, r) => a + Number(r.valor_diferencia || 0), 0);
  $('k-hist').innerHTML = `<table class="t"><tr><th>Producto</th><th class="n">Sistema</th><th class="n">Contado</th><th class="n">Diferencia</th><th>Resultado</th><th class="n">Valor</th><th>Contó</th></tr>
    ${data.map(r => `<tr><td>${esc(r.producto)}</td><td class="n">${C(r.cantidad_sistema, r.unidad_medida)}</td><td class="n">${C(r.cantidad_contada, r.unidad_medida)}</td><td class="n">${C(r.diferencia, r.unidad_medida)}</td>
      <td><span class="res ${r.resultado}">${r.resultado}</span></td><td class="n">${S(r.valor_diferencia)}</td><td>${esc(r.usuario || '')}</td></tr>`).join('')}</table>
    <div class="total"><span>Consumo <b>${S(suma('consumo'))}</b></span><span>Faltantes <b class="neg">${S(suma('faltante'))}</b></span><span>Sobrantes <b>${S(Math.abs(suma('sobrante')))}</b></span></div>`;
}

// ===== INVENTARIO INICIAL =====
let edIni;
async function tabInicial() {
  $('main').innerHTML = `<div class="bloque"><h3>Inventario inicial · ${esc(st.alm.nombre)}</h3>
    <p class="ayuda">Carga el stock con el que arranca este almacén. La cantidad <b>reemplaza</b> la que hay (no suma). Para insumos, paquetería y mercadería pon el <b>costo unitario sin IGV</b>; en terminados y bases el costo sale de la receta. Con cantidad 0 y un costo, solo carga el costo.</p>
    <div id="i-lineas"></div>
    <div class="total"><span>Valor cargado <b id="i-total">S/ 0.00</b></span></div>
    <div class="fila" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="i-ok">Guardar inventario inicial</button></div>
    <div class="error" id="i-error"></div><div class="okmsg" id="i-okmsg"></div></div>`;
  edIni = editorLineas($('i-lineas'), { stock: await stockMapa(st.alm.id), precio: true, costoUnit: true,
    onCambio: ls => { if ($('i-total')) $('i-total').textContent = S(ls.reduce((a, l) => a + Number(l.importe || 0) * Number(l.cantidad || 0), 0)); } });
  $('i-ok').onclick = async () => {
    $('i-error').textContent = ''; $('i-okmsg').textContent = '';
    const ls = edIni.lineas();
    if (!ls.length) return $('i-error').textContent = 'Agrega al menos un producto.';
    if (ls.some(l => l.cantidad === '' || Number(l.cantidad) < 0)) return $('i-error').textContent = 'Cada línea necesita cantidad (puede ser 0).';
    const sinCosto = ls.filter(l => ['insumo','paqueteria','mercaderia'].includes((st.productos.find(p => p.id === l.producto_id) || {}).tipo_item) && !(Number(l.importe) > 0));
    if (sinCosto.length && !confirm(`Sin costo: ${sinCosto.map(l => l.nombre).join(', ')}.\n¿Guardar igual? (su food cost saldrá en 0 hasta la primera compra)`)) return;
    if (!confirm(`Se dejará el stock de ${ls.length} producto(s) con las cantidades indicadas. ¿Continuar?`)) return;
    $('i-ok').disabled = true;
    const { data, error } = await sb.rpc('registrar_inventario_inicial', { p: { almacen_id: st.alm.id, usuario_id: st.usuario.id,
      items: ls.map(l => ({ producto_id: l.producto_id, cantidad: Number(l.cantidad), costo_unitario: l.importe === '' ? null : Number(l.importe) })) } });
    $('i-ok').disabled = false;
    if (error) return $('i-error').textContent = errTxt(error);
    $('i-okmsg').textContent = `✓ Inventario inicial cargado: ${data} producto(s).`; edIni.limpiar();
  };
}

// ===== KARDEX =====
async function tabKardex() {
  const d7 = new Date(Date.now() - 7 * 864e5).toLocaleDateString('en-CA', LIMA);
  $('main').innerHTML = `<div class="bloque"><h3>Kardex · ${esc(st.alm.nombre)}</h3>
    <div class="fila">
      <div class="campo buscador" style="flex:2"><label>Producto</label><input id="x-bq" placeholder="Buscar producto…" autocomplete="off"><div class="resultados oculto" id="x-res"></div></div>
      <div class="campo" style="max-width:170px"><label>Desde</label><input type="date" id="x-desde" value="${d7}"></div>
      <div class="campo" style="max-width:170px"><label>Hasta</label><input type="date" id="x-hasta" value="${hoy()}"></div>
      <button class="btn" id="x-ok">Ver</button>
    </div><div id="x-out" style="margin-top:14px"></div></div>`;
  let sel = st.kardexProd ? st.productos.find(p => p.id === st.kardexProd) : null; st.kardexProd = null;
  if (sel) $('x-bq').value = sel.nombre;
  $('x-bq').oninput = () => {
    sel = null; const q = $('x-bq').value.trim().toLowerCase(); if (q.length < 2) return $('x-res').classList.add('oculto');
    const enc = st.productos.filter(p => p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q)).slice(0, 15);
    $('x-res').innerHTML = enc.map(p => `<div data-p="${p.id}"><span>${esc(p.nombre)} <small>${p.codigo}</small></span>${tipoTag(p.tipo_item)}</div>`).join('') || '<div>Sin resultados</div>';
    $('x-res').classList.remove('oculto');
  };
  $('x-res').onclick = e => { const d = e.target.closest('[data-p]'); if (!d) return; sel = st.productos.find(p => p.id === Number(d.dataset.p)); $('x-bq').value = sel.nombre; $('x-res').classList.add('oculto'); ver(); };
  $('x-ok').onclick = ver;
  async function ver() {
    if (!sel) return $('x-out').innerHTML = '<div class="error">Elige un producto.</div>';
    const [k, s, post] = await Promise.all([
      sb.from('v_kardex').select('*').eq('almacen_id', st.alm.id).eq('producto_id', sel.id).gte('fecha', $('x-desde').value + 'T00:00:00-05:00').lte('fecha', $('x-hasta').value + 'T23:59:59-05:00').order('fecha').order('id'),
      sb.from('stock_actual').select('cantidad').eq('almacen_id', st.alm.id).eq('producto_id', sel.id).maybeSingle(),
      sb.from('v_kardex').select('cantidad').eq('almacen_id', st.alm.id).eq('producto_id', sel.id).gt('fecha', $('x-hasta').value + 'T23:59:59-05:00')
    ]);
    const rows = k.data || [];
    // saldo: se calcula hacia atrás desde el stock actual
    let saldoFinal = Number((s.data || {}).cantidad || 0) - (post.data || []).reduce((a, r) => a + Number(r.cantidad), 0);
    let saldo = saldoFinal - rows.reduce((a, r) => a + Number(r.cantidad), 0);
    const inicial = saldo, u = sel.unidad_medida;
    const ent = rows.filter(r => r.cantidad > 0).reduce((a, r) => a + Number(r.cantidad), 0), sal = rows.filter(r => r.cantidad < 0).reduce((a, r) => a - Number(r.cantidad), 0);
    $('x-out').innerHTML = `<div class="total" style="justify-content:flex-start"><span>Inicial <b>${C(inicial, u)}</b></span><span>Entradas <b class="pos">+${C(ent, u)}</b></span><span>Salidas <b class="neg">−${C(sal, u)}</b></span><span>Final <b>${C(saldoFinal, u)}</b></span></div>
      <table class="t" style="margin-top:10px"><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="n">Entrada</th><th class="n">Salida</th><th class="n">Saldo</th><th class="n">Costo unit.</th><th>Usuario</th></tr>
      ${rows.map(r => { saldo += Number(r.cantidad); return `<tr><td>${fh(r.fecha)}</td><td>${r.tipo}</td><td style="font-size:13px">${esc(r.referencia || '')}${r.otro_almacen ? ` <small style="color:#999">(${r.cantidad > 0 ? 'desde' : 'hacia'} ${esc(r.otro_almacen)})</small>` : ''}</td>
        <td class="n pos">${r.cantidad > 0 ? C(r.cantidad) : ''}</td><td class="n neg">${r.cantidad < 0 ? C(-r.cantidad) : ''}</td><td class="n"><b>${C(saldo)}</b></td><td class="n">${r.costo_unitario ? S(r.costo_unitario) : ''}</td><td>${esc(r.usuario || '')}</td></tr>`; }).join('') || '<tr><td colspan="8" class="vacio">Sin movimientos en esas fechas.</td></tr>'}</table>`;
  }
  if (sel) ver();
}

$('modal').onclick = e => { if (e.target === $('modal')) cerrarModal(); };
iniciar();
</script>
