<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadima Producción</title>
<meta name="theme-color" content="#8B0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Producción">
<link rel="manifest" href="produccion-manifest.webmanifest">
<link rel="icon" href="pos-icon-192.png">
<link rel="apple-touch-icon" href="pos-icon-192.png">
<style>
:root{--rojo:#8B0000;--fondo:#f6f4f2;--borde:#e3dfdb;--gris:#6b6b6b;--texto:#1f1f1f;--ok:#1e7d3a;--mal:#b00020;--azul:#1f5fbf}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:15px}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input{font:inherit;padding:10px;border:1px solid var(--borde);border-radius:8px;width:100%;margin-bottom:10px}
.oculto{display:none!important}
.btn{background:var(--rojo);color:#fff;padding:11px 16px;font-weight:700;width:100%}
.error{color:var(--mal);min-height:18px;margin-top:8px;text-align:center}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.tarjeta{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:24px;width:100%;max-width:360px}
.marca{color:var(--rojo);font-weight:800;font-size:22px;margin:0}.sub{color:var(--gris);margin:4px 0 16px}
.pin-puntos{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.pin-puntos span{width:14px;height:14px;border-radius:50%;border:2px solid var(--rojo)}.pin-puntos span.lleno{background:var(--rojo)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teclado button{padding:16px;font-size:20px;background:var(--fondo);font-weight:600}

.barra{background:var(--rojo);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.barra b{font-size:19px}
.grupo{display:flex;gap:6px;flex-wrap:wrap}
.grupo button{background:rgba(255,255,255,.15);color:#fff;padding:8px 13px;font-weight:700}
.grupo button.activa{background:#fff;color:var(--rojo)}
.barra .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra .vivo{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.18)}
.barra .usr{font-size:13px;opacity:.9;cursor:pointer}
#b-hechos{background:rgba(255,255,255,.15);color:#fff;padding:8px 13px;font-weight:700}
#b-hechos.activa{background:#fff;color:var(--ok)}
#b-sel{background:rgba(255,255,255,.15);color:#fff;padding:8px 13px;font-weight:700}
#b-sel span{display:inline-block;min-width:22px;padding:0 6px;border-radius:10px;background:#fff3c4;color:#7a5300;font-size:13px;margin-left:4px}
#b-sel.activa{background:#fff;color:var(--rojo)}
.sel-barra{max-width:1500px;margin:12px auto 0;padding:0 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg2{display:flex;background:#fff;border-radius:10px;padding:3px;gap:3px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.seg2 button{background:transparent;padding:9px 14px;font-weight:800;color:var(--gris)}
.seg2 button.activa{background:var(--rojo);color:#fff}
.sel-ayuda{font-size:13px;color:var(--gris)}
.entrega{font-size:13px;color:var(--gris);font-weight:700}
.ped.en_produccion{border-left:6px solid #e0a458}
.hecho button.trabajar{display:flex;align-items:center;gap:8px;background:#fff7e8;color:#9a5300;font-weight:800;font-size:15px;padding:10px 14px;border:2px solid #f0d5a8}
.hecho button.trabajar .caja{width:22px;height:22px;border-radius:6px;border:2px solid #c98a2b;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.hecho button.trabajar:hover{background:#f6e2c2;color:#9a5300}.hecho button.trabajar.on{background:#e0a458;color:#fff;border-color:#e0a458}.hecho button.trabajar.on .caja{background:#9a5300;border-color:#fff}
.top .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.consol{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);overflow:hidden}
.consol .fila-c{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 18px;border-top:1px solid #f0ece8;align-items:start}
.consol .fila-c:first-child{border-top:0}
.consol .tot{font-size:34px;font-weight:900;color:var(--rojo);line-height:1}
.consol .tot small{display:block;font-size:12px;color:var(--gris);font-weight:700;margin-top:4px}
.consol .nom{font-size:22px;font-weight:800}
.consol .det{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.consol .det span{background:var(--fondo);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.consol .notas{margin-top:8px;font-size:14px;color:#5c3d00}
.consol .notas div{background:#fff3c4;border-radius:8px;padding:5px 9px;margin-top:4px}
@media (max-width:700px){.consol .fila-c{grid-template-columns:80px 1fr}.consol .tot{font-size:26px}.consol .nom{font-size:17px}.top .acc{margin-left:0;width:100%}.top .acc button{flex:1;justify-content:center}}

/* ===== lista ===== */
.lista{max-width:1500px;margin:0 auto;padding:14px}
.dia{margin:6px 0 10px;font-size:14px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
.ped{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:12px 14px;margin-bottom:14px;transition:opacity .35s,transform .35s}
.ped.sale{opacity:0;transform:translateX(40px)}
.ped.nuevo{animation:brillo 1.2s ease 3}
@keyframes brillo{50%{box-shadow:0 0 0 5px #f3c8d0}}
.ped.hecha{opacity:.75}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hora{font-size:26px;font-weight:900}
.hora.tarde{color:var(--mal)}
.cod{color:var(--gris);font-weight:700;font-size:13px}
.ent{font-size:12px;font-weight:700;padding:2px 9px;border-radius:8px;background:#eef3fb;color:var(--azul)}
.ent.delivery{background:#fff1e0;color:#9a5300}
.top .hecho{margin-left:auto}
/* cada producto con su foto: la foto ocupa ~1/4 de la pantalla */
.prod{display:grid;grid-template-columns:min(25vw,520px) 1fr;gap:18px;padding:14px 0 4px;border-top:1px dashed #ece8e4;margin-top:10px;align-items:start}
.prod.sin{grid-template-columns:90px 1fr;align-items:center}
.foto{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--fondo);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:42px}
.prod.sin .foto{width:90px;height:90px;aspect-ratio:auto}
.foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.foto .mas{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:14px;font-weight:700;padding:4px 10px;border-radius:10px;cursor:zoom-in}
.mini{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:2px solid transparent}
.txt .nom{font-size:22px;font-weight:800;line-height:1.25}
.txt .nom b{color:var(--rojo);margin-right:8px}
.comp{margin:6px 0 0;padding-left:20px;font-size:16px;line-height:1.45;color:#333}
.comp li::marker{color:#8B0000}
.pers{display:block;font-size:17px;font-weight:700;color:#5c3d00;background:#fff3c4;border-radius:10px;padding:8px 11px;margin-top:8px;white-space:pre-wrap}
.nota{margin-top:10px;background:#fff3c4;font-weight:600;padding:6px 9px;border-radius:8px;font-size:14px}
.hecho button{display:flex;align-items:center;gap:10px;background:#e7f6ec;color:var(--ok);font-weight:800;font-size:17px;padding:12px 18px;border:2px solid #bfe3cb}
.hecho button .caja{width:24px;height:24px;border-radius:6px;border:2px solid var(--ok);background:#fff}
.hecho button:hover{background:var(--ok);color:#fff}
.hecho button.deshacer{background:var(--fondo);color:var(--texto);border-color:var(--borde);font-size:14px;padding:9px 14px}
.marca-hecho{font-size:13px;color:var(--ok);font-weight:700}
.vacio{color:var(--gris);font-size:15px;text-align:center;padding:30px;border:1px dashed var(--borde);border-radius:14px;background:#fff}

.visor{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:flex;align-items:center;justify-content:center}
.visor img{max-width:92vw;max-height:90vh;border-radius:10px}
.visor button{position:absolute;background:rgba(255,255,255,.2);color:#fff;font-size:26px;width:52px;height:52px;border-radius:50%}
.visor .cerrar{top:16px;right:16px}.visor .ant{left:16px}.visor .sig{right:16px}
.visor .cnt{position:absolute;bottom:18px;color:#fff;font-weight:700}
@media (max-width:700px){.prod{grid-template-columns:42vw 1fr;gap:10px}.txt .nom{font-size:17px}.pers{font-size:14px}.hora{font-size:21px}.hecho button{font-size:15px;padding:10px 14px}.top .hecho{margin-left:0;width:100%}.top .hecho button{width:100%;justify-content:center}}
</style>
</head>
<body>

<section id="v-login" class="centro oculto">
  <form class="tarjeta" id="f-login">
    <p class="marca">KADIMA</p><p class="sub">Producción · iniciar sesión</p>
    <input id="l-email" type="email" placeholder="Correo" required>
    <input id="l-pass" type="password" placeholder="Contraseña" required>
    <button class="btn">Ingresar</button><div class="error" id="l-error"></div>
  </form>
</section>
<section id="v-pin" class="centro oculto">
  <div class="tarjeta" style="max-width:340px">
    <p class="marca">KADIMA</p><p class="sub">Producción · Ingresa tu PIN</p>
    <div class="pin-puntos" id="pin-puntos"></div><div class="teclado" id="teclado"></div>
    <div class="error" id="pin-error"></div>
  </div>
</section>

<section id="v-app" class="oculto">
  <div class="barra">
    <b>Producción</b>
    <div class="grupo" id="rangos">
      <button data-r="hoy" class="activa">Hoy</button><button data-r="manana">Mañana</button>
      <button data-r="tres">3 días</button><button data-r="semana">Próx. 7 días</button><button data-r="todo">Todo</button>
    </div>
    <button id="b-sel">👩‍🍳 Seleccionados <span id="n-sel">0</span></button>
    <button id="b-hechos">☑ Ver hechos</button>
    <div class="der">
      <div class="grupo"><button id="z-menos" title="Letra más chica">A−</button><button id="z-mas" title="Letra más grande (TV)">A+</button></div>
      <span class="vivo" id="vivo">● conectando</span>
      <span class="usr" id="usr" title="Cambiar de usuario"></span>
    </div>
  </div>
  <div class="sel-barra oculto" id="sel-barra">
    <div class="seg2" id="sel-modo"><button data-m="consol" class="activa">🧮 Consolidado (total a preparar)</button><button data-m="pedido">📋 Por pedido</button></div>
    <span class="sel-ayuda">Pedidos que producción marcó para trabajar. La hora es la de <b>listo</b> (1 h antes de la entrega).</span>
  </div>
  <div class="lista" id="lista"></div>
</section>

<div class="visor oculto" id="visor">
  <button class="cerrar" id="v-cerrar">✕</button><button class="ant" id="v-ant">‹</button>
  <img id="visor-img" alt=""><button class="sig" id="v-sig">›</button><div class="cnt" id="v-cnt"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
// componentes del cotizador (base + adicionales + insumos) para que producción sepa qué lleva
function componentes(cot) {
  if (!cot) return [];
  const n = x => { const v = Number(x); return v % 1 ? String(Math.round(v * 1000) / 1000) : String(v); };
  const l = [];
  if (cot.base && cot.base.nombre) l.push(`Base: ${cot.base.nombre}${Number(cot.base.cantidad) && Number(cot.base.cantidad) !== 1 ? ' × ' + n(cot.base.cantidad) : ''}`);
  (cot.lineas || []).forEach(x => {
    if (!x || !x.nombre) return;
    if (x.tipo === 'adic') l.push(`${x.nombre}${Number(x.veces) > 1 ? ' × ' + n(x.veces) : ''}`);
    else if (x.tipo === 'insumo') l.push(`${x.nombre}${x.cantidad ? ` · ${n(x.cantidad)} ${x.unidad || ''}` : ''}`);
    else if (x.tipo === 'otro') l.push(x.nombre);
  });
  return l;
}

// =====================================================================
// Kadima Producción · lista de lo que hay que hacer (web + WhatsApp/tienda)
// Marcar "Hecho" pasa el pedido a "listo" y lo saca de la lista.
// No muestra datos del cliente ni pagos.
// =====================================================================
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'kadima-produccion-auth' } });
const PERMITIDOS = ['admin@kadima.pe', 'almacen@kadima.pe', 'caja@kadima.pe'];
const BUCKET = 'pedidos-fotos';
const PENDIENTES = ['confirmado', 'en_produccion'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const errTxt = e => { const m = (e && (e.message || e.error_description)) || String(e); return /fetch|network/i.test(m) ? 'Sin conexión a internet.' : /Invalid login/i.test(m) ? 'Correo o contraseña incorrectos.' : m; };
const leer = k => { try { return localStorage.getItem('kprod_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('kprod_' + k, v); } catch (e) {} };
const st = { usuario: null, rango: 'hoy', hechos: false, sel: false, selModo: leer('selmodo') || 'consol', pedidos: [], urls: {}, inicio: new Date(), avisados: new Set(), zoom: Number(leer('zoom') || 1), visor: { fotos: [], i: 0 } };

// ===== sesión =====
function vista(id) { ['v-login', 'v-pin', 'v-app'].forEach(v => $(v).classList.toggle('oculto', v !== id)); }
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = errTxt(error);
  iniciar();
});
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return vista('v-login');
  if (!PERMITIDOS.includes((data.session.user?.email || '').toLowerCase())) { await sb.auth.signOut(); vista('v-login'); return $('l-error').textContent = 'Este usuario no tiene acceso a Producción.'; }
  pedirPin();
}
let pin = '';
function pedirPin() { pin = ''; vista('v-pin'); $('pin-error').textContent = ''; dibujarPin(); }
function dibujarPin() { $('pin-puntos').innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < pin.length ? 'lleno' : ''}"></span>`).join(''); }
$('teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(t => `<button data-t="${t}">${t}</button>`).join('');
$('teclado').onclick = e => { const t = e.target.dataset.t; if (!t) return; if (t === '⌫') pin = pin.slice(0, -1); else if (t === 'OK') return validarPin(); else if (pin.length < 6) pin += t; dibujarPin(); if (pin.length === 4) validarPin(); };
document.addEventListener('keydown', e => {
  if (!$('visor').classList.contains('oculto')) { if (e.key === 'Escape') cerrarVisor(); if (e.key === 'ArrowRight') moverVisor(1); if (e.key === 'ArrowLeft') moverVisor(-1); return; }
  if ($('v-pin').classList.contains('oculto')) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 6) { pin += e.key; dibujarPin(); if (pin.length === 4) validarPin(); }
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); dibujarPin(); }
});
async function validarPin() {
  const { data, error } = await sb.from('usuarios').select('id,nombre,rol,pin').eq('activo', true);
  if (error) { $('pin-error').textContent = errTxt(error); pin = ''; return dibujarPin(); }
  const u = (data || []).find(x => x.pin === pin);
  if (!u) { $('pin-error').textContent = 'PIN incorrecto'; pin = ''; return dibujarPin(); }
  st.usuario = u; abrirApp();
}
$('usr').onclick = () => { if (confirm('¿Cambiar de usuario?')) pedirPin(); };

// ===== fechas =====
const pad2 = n => String(n).padStart(2, '0');
const fstr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dias = n => { const d = new Date(); d.setDate(d.getDate() + n); return fstr(d); };
const hora12 = t => { if (!t) return 'sin hora'; const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad2(m)} ${h >= 12 ? 'pm' : 'am'}`; };
// producción trabaja con la hora de LISTO: 1 hora antes de la entrega (tiempo para entregar o enviar)
const MARGEN_MIN = 60;
const horaListo = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); const x = Math.max(0, h * 60 + m - MARGEN_MIN); return `${pad2(Math.floor(x / 60))}:${pad2(x % 60)}`; };
const fechaLarga = f => f === dias(0) ? 'Hoy' : f === dias(1) ? 'Mañana' : new Date(f + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });

// ===== datos (solo lo que producción necesita) =====
function rango(q) {
  if (st.rango === 'hoy') q = q.eq('fecha_entrega', dias(0));
  else if (st.rango === 'manana') q = q.eq('fecha_entrega', dias(1));
  else if (st.rango === 'tres') q = q.gte('fecha_entrega', dias(0)).lte('fecha_entrega', dias(2));
  else if (st.rango === 'semana') q = q.gte('fecha_entrega', dias(0)).lte('fecha_entrega', dias(7));
  else if (st.hechos) q = q.gte('fecha_entrega', dias(-7));   // "Todo" en hechos: solo la última semana
  return q;
}
async function cargar() {
  const estados = st.hechos ? ['listo'] : st.sel ? ['en_produccion'] : PENDIENTES;
  const filtro = q => st.sel ? q : rango(q);   // seleccionados: todos, sin importar la fecha
  contarSel();
  const [w, e] = await Promise.all([
    filtro(sb.from('pedidos_web').select('id,codigo,estado,fecha_entrega,hora_entrega,tipo_entrega,notas,creado_en,pedidos_web_items(nombre,cantidad)').in('estado', estados)),
    filtro(sb.from('pedidos_encargo').select('id,codigo,estado,fecha_entrega,hora_entrega,tipo_entrega,creado_en,pedidos_encargo_items(orden,descripcion,personalizacion,cantidad,cotizacion),pedidos_encargo_fotos(item_orden,ruta)').in('estado', estados)),
  ]);
  if (w.error || e.error) { $('lista').innerHTML = `<div class="vacio">${esc(errTxt(w.error || e.error))}</div>`; return; }
  const lista = [
    ...(w.data || []).map(p => ({ key: 'w' + p.id, origen: 'web', id: p.id, codigo: p.codigo, estado: p.estado, fecha: p.fecha_entrega, hora: p.hora_entrega, tipo: p.tipo_entrega, nota: p.notas, creado: p.creado_en,
      items: (p.pedidos_web_items || []).map(i => ({ desc: i.nombre, cant: Number(i.cantidad), pers: '', fotos: [] })) })),
    ...(e.data || []).map(p => {
      const its = (p.pedidos_encargo_items || []).sort((a, b) => a.orden - b.orden);
      const fotos = p.pedidos_encargo_fotos || [];
      const items = its.map(i => ({ desc: i.descripcion, cant: Number(i.cantidad), pers: i.personalizacion, comp: componentes(i.cotizacion), fotos: fotos.filter(f => f.item_orden === i.orden).map(f => f.ruta) }));
      // fotos sin producto asignado: van al primero
      const sueltas = fotos.filter(f => !its.some(i => i.orden === f.item_orden)).map(f => f.ruta);
      if (sueltas.length && items[0]) items[0].fotos.push(...sueltas);
      return { key: 'e' + p.id, origen: 'enc', id: p.id, codigo: p.codigo, estado: p.estado, fecha: p.fecha_entrega, hora: p.hora_entrega, tipo: p.tipo_entrega, nota: '', creado: p.creado_en, items };
    }),
  ].sort((a, b) => st.hechos
    ? (b.fecha || '').localeCompare(a.fecha || '') || (b.hora || '').localeCompare(a.hora || '')
    : (a.fecha || '').localeCompare(b.fecha || '') || (a.hora || '99').localeCompare(b.hora || '99'));
  const faltan = [...new Set(lista.flatMap(p => p.items.flatMap(i => i.fotos)))].filter(r => !st.urls[r]);
  if (faltan.length) { const { data } = await sb.storage.from(BUCKET).createSignedUrls(faltan, 60 * 60 * 6); (data || []).forEach(d => { if (d.signedUrl) st.urls[d.path] = d.signedUrl; }); }
  const nuevos = st.hechos || st.sel ? [] : lista.filter(p => new Date(p.creado) > st.inicio && !st.avisados.has(p.key)).map(p => p.key);
  nuevos.forEach(k => st.avisados.add(k));
  st.pedidos = lista; dibujar(nuevos);
  if (nuevos.length) sonar();
}

// ===== lista =====
async function contarSel() {
  const [a, b] = await Promise.all([
    sb.from('pedidos_web').select('id').eq('estado', 'en_produccion'),
    sb.from('pedidos_encargo').select('id').eq('estado', 'en_produccion'),
  ]);
  $('n-sel').textContent = (a.data || []).length + (b.data || []).length;
}
function dibujar(nuevos = []) {
  if (!st.pedidos.length) {
    $('lista').innerHTML = `<div class="vacio">${st.hechos ? 'Aún no hay pedidos marcados como hechos en este rango.' : st.sel ? 'Aún no hay pedidos seleccionados. En la lista, marca <b>👩‍🍳 Trabajar</b> en los pedidos que van a preparar.' : '🎉 No hay nada pendiente por hacer en este rango.'}</div>`;
    return;
  }
  if (st.sel && st.selModo === 'consol') return dibujarConsolidado();
  const hoy = dias(0), ahora = new Date().getHours() * 60 + new Date().getMinutes();
  let fechaAnt = null, html = '';
  st.pedidos.forEach(p => {
    if (p.fecha !== fechaAnt) { html += `<div class="dia">${fechaLarga(p.fecha)}</div>`; fechaAnt = p.fecha; }
    html += fila(p, hoy, ahora, nuevos.includes(p.key));
  });
  $('lista').innerHTML = html;
}
function fila(p, hoy, ahora, nuevo) {
  const hl = horaListo(p.hora);
  const [h, m] = (hl || '23:59').split(':').map(Number);
  const tarde = !st.hechos && (p.fecha < hoy || (p.fecha === hoy && h * 60 + m < ahora));
  const sel = p.estado === 'en_produccion';
  const boton = st.hechos
    ? `<span class="marca-hecho">✓ Hecho</span> <button class="deshacer" data-deshacer="${p.key}">↩ Volver a pendientes</button>`
    : `<button class="trabajar ${sel ? 'on' : ''}" data-trabajar="${p.key}" title="Marcar que este pedido se va a trabajar"><span class="caja">${sel ? '✓' : ''}</span>${sel ? 'Trabajando' : 'Trabajar'}</button><button data-hecho="${p.key}"><span class="caja"></span>Marcar como hecho</button>`;
  const prods = p.items.map((i, n) => {
    const urls = i.fotos.map(r => st.urls[r]).filter(Boolean);
    const foto = urls.length
      ? `<img src="${urls[0]}" data-ver="${p.key}" data-it="${n}" data-i="0" alt="referencia">${urls.length > 1 ? `<span class="mas" data-ver="${p.key}" data-it="${n}" data-i="0">+${urls.length - 1}</span>` : ''}`
      : '🎂';
    return `<div class="prod ${urls.length ? '' : 'sin'}">
      <div><div class="foto">${foto}</div>${urls.length > 1 ? `<div class="mini">${urls.map((u, k) => `<img src="${u}" data-ver="${p.key}" data-it="${n}" data-i="${k}" alt="">`).join('')}</div>` : ''}</div>
      <div class="txt"><div class="nom"><b>${i.cant}×</b>${esc(i.desc)}</div>${i.comp && i.comp.length ? `<ul class="comp">${i.comp.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}${i.pers ? `<span class="pers">✏️ ${esc(i.pers)}</span>` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="ped ${st.hechos ? 'hecha' : ''} ${sel && !st.hechos ? 'en_produccion' : ''} ${nuevo ? 'nuevo' : ''}" id="f-${p.key}">
    <div class="top"><span class="hora ${tarde ? 'tarde' : ''}">${p.hora ? 'Listo ' + hora12(hl) : 'sin hora'}</span>${p.hora ? `<span class="entrega">entrega ${hora12(p.hora)}</span>` : ''}<span class="ent ${p.tipo}">${p.tipo === 'delivery' ? '🛵 Delivery' : '🏬 Recojo'}</span><span class="cod">${esc(p.codigo)}</span><div class="hecho acc">${boton}</div></div>
    ${prods}
    ${p.nota ? `<div class="nota">📝 ${esc(p.nota)}</div>` : ''}
  </div>`;
}
// suma lo mismo de distintos pedidos para sacar lotes: "70 empanadas de pollo · 100 alfajores"
function dibujarConsolidado() {
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  const grupos = new Map();
  st.pedidos.forEach(p => p.items.forEach(i => {
    const k = norm(i.desc) + '|' + (i.comp || []).map(norm).join(';');
    if (!grupos.has(k)) grupos.set(k, { desc: i.desc, comp: i.comp || [], total: 0, det: [], notas: [] });
    const g = grupos.get(k); g.total += Number(i.cant) || 0;
    const hl = horaListo(p.hora);
    g.det.push(`${esc(p.codigo)} · ${fechaLarga(p.fecha)}${hl ? ' ' + hora12(hl) : ''} · <b>${i.cant}</b>`);
    if (i.pers) g.notas.push(`<b>${esc(p.codigo)}</b> (${i.cant}): ${esc(i.pers)}`);
  }));
  const lista = [...grupos.values()].sort((a, b) => b.total - a.total || a.desc.localeCompare(b.desc));
  const nPed = st.pedidos.length, nUni = lista.reduce((a, g) => a + g.total, 0);
  $('lista').innerHTML = `<div class="dia">${lista.length} producto(s) · ${nUni} unidades · de ${nPed} pedido(s)</div>
    <div class="consol">${lista.map(g => `<div class="fila-c">
      <div class="tot">${g.total}<small>${g.det.length > 1 ? 'en ' + g.det.length + ' pedidos' : '1 pedido'}</small></div>
      <div><div class="nom">${esc(g.desc)}</div>${g.comp.length ? `<ul class="comp">${g.comp.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
        <div class="det">${g.det.map(d => `<span>${d}</span>`).join('')}</div>
        ${g.notas.length ? `<div class="notas">${g.notas.map(n => `<div>✏️ ${n}</div>`).join('')}</div>` : ''}</div>
    </div>`).join('')}</div>`;
}
async function cambiar(p, estado) {
  const tabla = p.origen === 'web' ? 'pedidos_web' : 'pedidos_encargo';
  const cambios = { estado, actualizado_por: st.usuario?.nombre || null };
  if (p.origen === 'enc') cambios.actualizado_en = new Date().toISOString();
  const { error } = await sb.from(tabla).update(cambios).eq('id', p.id);
  if (error) { alert(errTxt(error)); return false; }
  return true;
}
$('lista').onclick = async e => {
  const v = e.target.closest('[data-ver]'); if (v) return abrirVisor(v.dataset.ver, Number(v.dataset.it), Number(v.dataset.i));
  const t = e.target.closest('[data-trabajar]');
  if (t) {
    const p = st.pedidos.find(x => x.key === t.dataset.trabajar); if (!p) return;
    const nuevo = p.estado === 'en_produccion' ? 'confirmado' : 'en_produccion';
    t.disabled = true;
    if (!(await cambiar(p, nuevo))) { t.disabled = false; return; }
    p.estado = nuevo; contarSel();
    if (st.sel && nuevo !== 'en_produccion') st.pedidos = st.pedidos.filter(x => x.key !== p.key);
    return dibujar();
  }
  const b = e.target.closest('[data-hecho], [data-deshacer]'); if (!b) return;
  const key = b.dataset.hecho || b.dataset.deshacer, p = st.pedidos.find(x => x.key === key);
  b.disabled = true;
  if (!(await cambiar(p, b.dataset.hecho ? 'listo' : 'confirmado'))) { b.disabled = false; return; }
  const el = $('f-' + key); el.classList.add('sale');
  setTimeout(() => { st.pedidos = st.pedidos.filter(x => x.key !== key); dibujar(); }, 350);
};

// ===== visor de fotos =====
function abrirVisor(key, it, i) {
  const p = st.pedidos.find(x => x.key === key); if (!p || !p.items[it]) return;
  st.visor = { fotos: p.items[it].fotos.map(r => st.urls[r]).filter(Boolean), i };
  if (!st.visor.fotos.length) return;
  $('visor').classList.remove('oculto'); pintarVisor();
}
function pintarVisor() {
  const { fotos, i } = st.visor; $('visor-img').src = fotos[i];
  $('v-cnt').textContent = fotos.length > 1 ? `${i + 1} / ${fotos.length}` : '';
  $('v-ant').classList.toggle('oculto', fotos.length < 2); $('v-sig').classList.toggle('oculto', fotos.length < 2);
}
function moverVisor(d) { const n = st.visor.fotos.length; if (n < 2) return; st.visor.i = (st.visor.i + d + n) % n; pintarVisor(); }
function cerrarVisor() { $('visor').classList.add('oculto'); }
$('v-cerrar').onclick = cerrarVisor; $('v-ant').onclick = () => moverVisor(-1); $('v-sig').onclick = () => moverVisor(1);
$('visor').onclick = e => { if (e.target.id === 'visor') cerrarVisor(); };

function sonar() {
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.2, ctx.currentTime + t); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18); });
  } catch (e) {}
}

// ===== controles =====
$('rangos').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; st.rango = b.dataset.r; [...$('rangos').children].forEach(x => x.classList.toggle('activa', x === b)); cargar(); };
function modoSel(on) {
  st.sel = on; $('b-sel').classList.toggle('activa', on); $('sel-barra').classList.toggle('oculto', !on);
  $('rangos').classList.toggle('oculto', on);
  if (on && st.hechos) { st.hechos = false; $('b-hechos').classList.remove('activa'); $('b-hechos').textContent = '☑ Ver hechos'; }
}
$('b-sel').onclick = () => { modoSel(!st.sel); cargar(); };
$('sel-modo').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; st.selModo = b.dataset.m; guardar('selmodo', st.selModo); [...$('sel-modo').children].forEach(x => x.classList.toggle('activa', x === b)); dibujar(); };
$('b-hechos').onclick = () => { if (st.sel) modoSel(false); st.hechos = !st.hechos; $('b-hechos').classList.toggle('activa', st.hechos); $('b-hechos').textContent = st.hechos ? '← Volver a pendientes' : '☑ Ver hechos'; cargar(); };
function aplicarZoom() { document.body.style.zoom = st.zoom; guardar('zoom', st.zoom); }
$('z-mas').onclick = () => { st.zoom = Math.min(2, Math.round((st.zoom + 0.1) * 10) / 10); aplicarZoom(); };
$('z-menos').onclick = () => { st.zoom = Math.max(0.7, Math.round((st.zoom - 0.1) * 10) / 10); aplicarZoom(); };

function abrirApp() {
  [...$('sel-modo').children].forEach(x => x.classList.toggle('activa', x.dataset.m === st.selModo));
  vista('v-app'); $('usr').textContent = st.usuario?.nombre || ''; aplicarZoom();
  cargar();
  sb.channel('kadima-produccion')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_web' }, () => cargar())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_encargo' }, () => cargar())
    .subscribe(s => { $('vivo').textContent = s === 'SUBSCRIBED' ? '● en vivo' : '● reconectando'; });
  setInterval(cargar, 30000);
  setInterval(() => dibujar(), 60000);
}
iniciar();
</script>
</body>
