<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadima Producción</title>
<meta name="theme-color" content="#8B0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Producción">
<link rel="manifest" href="produccion-manifest.webmanifest">
<link rel="icon" href="pos-icon-192.png">
<link rel="apple-touch-icon" href="pos-icon-192.png">
<style>
:root{--rojo:#8B0000;--fondo:#f6f4f2;--borde:#e3dfdb;--gris:#6b6b6b;--texto:#1f1f1f;--ok:#1e7d3a;--aviso:#b26a00;--mal:#b00020;--azul:#1f5fbf}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:15px}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input{font:inherit;padding:10px;border:1px solid var(--borde);border-radius:8px;width:100%;margin-bottom:10px}
.oculto{display:none!important}
.btn{background:var(--rojo);color:#fff;padding:11px 16px;font-weight:700;width:100%}
.error{color:var(--mal);min-height:18px;margin-top:8px;text-align:center}
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.tarjeta{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:24px;width:100%;max-width:360px}
.marca{color:var(--rojo);font-weight:800;font-size:22px;margin:0}.sub{color:var(--gris);margin:4px 0 16px}
.pin-puntos{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.pin-puntos span{width:14px;height:14px;border-radius:50%;border:2px solid var(--rojo)}.pin-puntos span.lleno{background:var(--rojo)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teclado button{padding:16px;font-size:20px;background:var(--fondo);font-weight:600}

.barra{background:var(--rojo);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.barra b{font-size:19px}
.grupo{display:flex;gap:6px;flex-wrap:wrap}
.grupo button{background:rgba(255,255,255,.15);color:#fff;padding:8px 13px;font-weight:700}
.grupo button.activa{background:#fff;color:var(--rojo)}
.barra .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.barra .vivo{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.18)}
.barra .usr{font-size:13px;opacity:.9;cursor:pointer}

.tablero{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:14px;padding:14px;align-items:start}
.col h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);display:flex;justify-content:space-between}
.col h3 span{background:#fff;border-radius:10px;padding:0 9px;color:var(--texto)}
.ped{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);margin-bottom:12px;border-left:7px solid #bbb;overflow:hidden}
.ped.confirmado{border-left-color:var(--azul)}.ped.en_produccion{border-left-color:var(--aviso)}.ped.listo{border-left-color:var(--ok);opacity:.85}
.ped.nuevo{animation:brillo 1.2s ease 3}
@keyframes brillo{50%{box-shadow:0 0 0 5px #f3c8d0}}
.ped .c1{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 0;gap:8px}
.ped .hora{font-size:22px;font-weight:900}
.ped .hora.tarde{color:var(--mal)}
.ped .hora small{font-size:13px;font-weight:700;color:var(--gris);display:block}
.ped .cod{font-weight:700;color:var(--gris);font-size:13px;text-align:right}
.ped .ent{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:8px;margin:4px 0 0 14px;background:#eef3fb;color:var(--azul)}
.ped .ent.delivery{background:#fff1e0;color:#9a5300}
.its{list-style:none;margin:6px 0 0;padding:0 14px}
.its li{padding:8px 0;border-top:1px dashed #e8e4e0;font-size:17px;font-weight:600}
.its li b{display:inline-block;min-width:38px;font-size:20px;color:var(--rojo)}
.pers{display:block;font-size:15px;font-weight:700;color:#5c3d00;background:#fff3c4;border-radius:8px;padding:6px 9px;margin-top:5px;white-space:pre-wrap}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fotos img{width:104px;height:104px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--borde);background:#eee}
.nota{margin:6px 14px 0;background:#fff3c4;font-weight:600;padding:6px 9px;border-radius:8px;font-size:14px}
.acc{display:flex;gap:8px;padding:10px 14px 14px}
.acc button{flex:1;padding:13px;font-weight:800;font-size:16px}
.b-sig{background:var(--rojo);color:#fff}.b-ok{background:var(--ok);color:#fff}
.b-sec{background:var(--fondo);color:var(--texto);flex:0 0 auto!important;padding:13px 15px!important}
.vacio{color:var(--gris);font-size:14px;text-align:center;padding:18px;border:1px dashed var(--borde);border-radius:12px}

.resumen{padding:14px;max-width:1000px;margin:0 auto}
.dia{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.dia h3{margin:0 0 8px;font-size:17px}
.dia table{width:100%;border-collapse:collapse}
.dia td{padding:8px 4px;border-top:1px solid #f1ede9;font-size:16px}
.dia td.n{width:70px;font-weight:900;font-size:20px;color:var(--rojo)}
.dia td small{color:var(--gris);font-size:12.5px}

.visor{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.visor img{max-width:96vw;max-height:94vh;border-radius:10px}
@media (max-width:900px){.tablero{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="v-login" class="centro oculto">
  <form class="tarjeta" id="f-login">
    <p class="marca">KADIMA</p><p class="sub">Producción · iniciar sesión</p>
    <input id="l-email" type="email" placeholder="Correo" required>
    <input id="l-pass" type="password" placeholder="Contraseña" required>
    <button class="btn">Ingresar</button><div class="error" id="l-error"></div>
  </form>
</section>
<section id="v-pin" class="centro oculto">
  <div class="tarjeta" style="max-width:340px">
    <p class="marca">KADIMA</p><p class="sub">Producción · Ingresa tu PIN</p>
    <div class="pin-puntos" id="pin-puntos"></div><div class="teclado" id="teclado"></div>
    <div class="error" id="pin-error"></div>
  </div>
</section>

<section id="v-app" class="oculto">
  <div class="barra">
    <b>Producción</b>
    <div class="grupo" id="rangos">
      <button data-r="hoy" class="activa">Hoy</button><button data-r="manana">Mañana</button>
      <button data-r="semana">Próx. 7 días</button><button data-r="pend">Todo pendiente</button>
    </div>
    <div class="grupo" id="vistas"><button data-v="pedidos" class="activa">🎂 Pedidos</button><button data-v="resumen">🧾 Resumen a producir</button></div>
    <div class="der">
      <div class="grupo"><button id="z-menos" title="Letra más chica">A−</button><button id="z-mas" title="Letra más grande (TV)">A+</button></div>
      <span class="vivo" id="vivo">● conectando</span>
      <span class="usr" id="usr" title="Cambiar de usuario"></span>
    </div>
  </div>
  <div class="tablero" id="tablero"></div>
  <div class="resumen oculto" id="resumen"></div>
</section>

<div class="visor oculto" id="visor"><img id="visor-img" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
// =====================================================================
// Kadima Producción · qué producir y para cuándo (web + WhatsApp/tienda)
// No muestra datos del cliente ni pagos.
// =====================================================================
const SUPABASE_URL = 'https://odhcnrjbmydjghafichc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mQOvV92En3KhDElmhStMSQ_TI04BdOK';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'kadima-produccion-auth' } });
const PERMITIDOS = ['admin@kadima.pe', 'almacen@kadima.pe', 'caja@kadima.pe'];
const BUCKET = 'pedidos-fotos';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const errTxt = e => { const m = (e && (e.message || e.error_description)) || String(e); return /fetch|network/i.test(m) ? 'Sin conexión a internet.' : /Invalid login/i.test(m) ? 'Correo o contraseña incorrectos.' : m; };
const leer = k => { try { return localStorage.getItem('kprod_' + k); } catch (e) { return null; } };
const guardar = (k, v) => { try { localStorage.setItem('kprod_' + k, v); } catch (e) {} };
const st = { usuario: null, rango: 'hoy', vista: 'pedidos', pedidos: [], urls: {}, inicio: new Date(), avisados: new Set(), zoom: Number(leer('zoom') || 1) };

// ===== sesión =====
function vista(id) { ['v-login', 'v-pin', 'v-app'].forEach(v => $(v).classList.toggle('oculto', v !== id)); }
$('f-login').addEventListener('submit', async ev => {
  ev.preventDefault(); $('l-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) return $('l-error').textContent = errTxt(error);
  iniciar();
});
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return vista('v-login');
  if (!PERMITIDOS.includes((data.session.user?.email || '').toLowerCase())) { await sb.auth.signOut(); vista('v-login'); return $('l-error').textContent = 'Este usuario no tiene acceso a Producción.'; }
  pedirPin();
}
let pin = '';
function pedirPin() { pin = ''; vista('v-pin'); $('pin-error').textContent = ''; dibujarPin(); }
function dibujarPin() { $('pin-puntos').innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < pin.length ? 'lleno' : ''}"></span>`).join(''); }
$('teclado').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(t => `<button data-t="${t}">${t}</button>`).join('');
$('teclado').onclick = e => { const t = e.target.dataset.t; if (!t) return; if (t === '⌫') pin = pin.slice(0, -1); else if (t === 'OK') return validarPin(); else if (pin.length < 6) pin += t; dibujarPin(); if (pin.length === 4) validarPin(); };
document.addEventListener('keydown', e => {
  if ($('v-pin').classList.contains('oculto')) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 6) { pin += e.key; dibujarPin(); if (pin.length === 4) validarPin(); }
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); dibujarPin(); }
});
async function validarPin() {
  const { data, error } = await sb.from('usuarios').select('id,nombre,rol,pin').eq('activo', true);
  if (error) { $('pin-error').textContent = errTxt(error); pin = ''; return dibujarPin(); }
  const u = (data || []).find(x => x.pin === pin);
  if (!u) { $('pin-error').textContent = 'PIN incorrecto'; pin = ''; return dibujarPin(); }
  st.usuario = u; abrirApp();
}
$('usr').onclick = () => { if (confirm('¿Cambiar de usuario?')) pedirPin(); };

// ===== fechas =====
const pad2 = n => String(n).padStart(2, '0');
const fstr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dias = n => { const d = new Date(); d.setDate(d.getDate() + n); return fstr(d); };
const hora12 = t => { if (!t) return 'sin hora'; const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad2(m)} ${h >= 12 ? 'pm' : 'am'}`; };
const fechaLarga = f => new Date(f + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
const fechaCorta = f => new Date(f + 'T12:00:00').toLocaleDateString('es-PE', { weekday: 'short', day: 'numeric', month: 'short' });

// ===== datos (solo lo que producción necesita) =====
function rango(q) {
  if (st.rango === 'hoy') q = q.eq('fecha_entrega', dias(0));
  else if (st.rango === 'manana') q = q.eq('fecha_entrega', dias(1));
  else if (st.rango === 'semana') q = q.gte('fecha_entrega', dias(0)).lte('fecha_entrega', dias(7));
  return q;
}
async function cargar() {
  const estados = st.rango === 'pend' ? ['confirmado', 'en_produccion'] : ['confirmado', 'en_produccion', 'listo'];
  const [w, e] = await Promise.all([
    rango(sb.from('pedidos_web').select('id,codigo,estado,fecha_entrega,hora_entrega,tipo_entrega,notas,creado_en,pedidos_web_items(nombre,cantidad)').in('estado', estados)),
    rango(sb.from('pedidos_encargo').select('id,codigo,estado,fecha_entrega,hora_entrega,tipo_entrega,creado_en,pedidos_encargo_items(orden,descripcion,personalizacion,cantidad),pedidos_encargo_fotos(item_orden,ruta)').in('estado', estados)),
  ]);
  if (w.error || e.error) { $('tablero').innerHTML = `<div class="vacio" style="grid-column:1/-1">${esc(errTxt(w.error || e.error))}</div>`; return; }
  const lista = [
    ...(w.data || []).map(p => ({ key: 'w' + p.id, origen: 'web', id: p.id, codigo: p.codigo, estado: p.estado, fecha: p.fecha_entrega, hora: p.hora_entrega, tipo: p.tipo_entrega, nota: p.notas, creado: p.creado_en,
      items: (p.pedidos_web_items || []).map(i => ({ desc: i.nombre, cant: Number(i.cantidad), pers: '', fotos: [] })) })),
    ...(e.data || []).map(p => { const f = p.pedidos_encargo_fotos || []; return { key: 'e' + p.id, origen: 'enc', id: p.id, codigo: p.codigo, estado: p.estado, fecha: p.fecha_entrega, hora: p.hora_entrega, tipo: p.tipo_entrega, nota: '', creado: p.creado_en,
      items: (p.pedidos_encargo_items || []).sort((a, b) => a.orden - b.orden).map(i => ({ desc: i.descripcion, cant: Number(i.cantidad), pers: i.personalizacion, fotos: f.filter(x => x.item_orden === i.orden).map(x => x.ruta) })) }; }),
  ].sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '') || (a.hora || '99').localeCompare(b.hora || '99'));
  const faltan = [...new Set(lista.flatMap(p => p.items.flatMap(i => i.fotos)))].filter(r => !st.urls[r]);
  if (faltan.length) { const { data } = await sb.storage.from(BUCKET).createSignedUrls(faltan, 60 * 60 * 6); (data || []).forEach(d => { if (d.signedUrl) st.urls[d.path] = d.signedUrl; }); }
  const nuevos = lista.filter(p => new Date(p.creado) > st.inicio && !st.avisados.has(p.key)).map(p => p.key);
  nuevos.forEach(k => st.avisados.add(k));
  st.pedidos = lista; dibujar(nuevos);
  if (nuevos.length) sonar();
}

// ===== vista pedidos =====
const COLS = [{ id: 'confirmado', t: '📋 Por hacer' }, { id: 'en_produccion', t: '👩‍🍳 En producción' }, { id: 'listo', t: '✅ Listos' }];
const SIG = { confirmado: ['en_produccion', 'Empezar', 'b-sig'], en_produccion: ['listo', '✓ Listo', 'b-ok'] };
const ANT = { en_produccion: 'confirmado', listo: 'en_produccion' };
function dibujar(nuevos = []) {
  if (st.vista === 'resumen') return dibujarResumen();
  const hoy = dias(0), ahora = new Date().getHours() * 60 + new Date().getMinutes();
  $('tablero').innerHTML = COLS.map(c => {
    const l = st.pedidos.filter(p => p.estado === c.id);
    return `<div class="col"><h3>${c.t}<span>${l.length}</span></h3>${l.length ? l.map(p => tarjeta(p, hoy, ahora, nuevos.includes(p.key))).join('') : '<div class="vacio">Nada aquí</div>'}</div>`;
  }).join('');
}
function tarjeta(p, hoy, ahora, nuevo) {
  const [h, m] = (p.hora || '23:59').split(':').map(Number);
  const tarde = p.estado !== 'listo' && (p.fecha < hoy || (p.fecha === hoy && h * 60 + m < ahora));
  const sig = SIG[p.estado];
  return `<div class="ped ${p.estado} ${nuevo ? 'nuevo' : ''}">
    <div class="c1"><div class="hora ${tarde ? 'tarde' : ''}">${hora12(p.hora)}${p.fecha !== hoy ? `<small>${fechaCorta(p.fecha)}</small>` : ''}</div><div class="cod">${esc(p.codigo)}<br>${p.origen === 'web' ? '🌐 web' : '💬 encargo'}</div></div>
    <span class="ent ${p.tipo}">${p.tipo === 'delivery' ? '🛵 Sale por delivery' : '🏬 Recojo en tienda'}</span>
    <ul class="its">${p.items.map(i => `<li><b>${i.cant}×</b>${esc(i.desc)}${i.pers ? `<span class="pers">✏️ ${esc(i.pers)}</span>` : ''}${i.fotos.length ? `<div class="fotos">${i.fotos.map(r => st.urls[r] ? `<img src="${st.urls[r]}" data-zoom="${esc(st.urls[r])}" alt="referencia" loading="lazy">` : '').join('')}</div>` : ''}</li>`).join('')}</ul>
    ${p.nota ? `<div class="nota">📝 ${esc(p.nota)}</div>` : ''}
    <div class="acc">${ANT[p.estado] ? `<button class="b-sec" data-atras="${p.key}" title="Regresar">↩</button>` : ''}${sig ? `<button class="${sig[2]}" data-sig="${p.key}">${sig[1]}</button>` : ''}</div>
  </div>`;
}
async function cambiar(p, estado) {
  const tabla = p.origen === 'web' ? 'pedidos_web' : 'pedidos_encargo';
  const cambios = { estado, actualizado_por: st.usuario?.nombre || null };
  if (p.origen === 'enc') cambios.actualizado_en = new Date().toISOString();
  const { error } = await sb.from(tabla).update(cambios).eq('id', p.id);
  if (error) return alert(errTxt(error));
  p.estado = estado; dibujar();
}
$('tablero').onclick = e => {
  const s = e.target.closest('[data-sig]'); if (s) { const p = st.pedidos.find(x => x.key === s.dataset.sig); return cambiar(p, SIG[p.estado][0]); }
  const a = e.target.closest('[data-atras]'); if (a) { const p = st.pedidos.find(x => x.key === a.dataset.atras); return cambiar(p, ANT[p.estado]); }
};

// ===== vista resumen: total por producto y día (lo que falta producir) =====
function dibujarResumen() {
  const pend = st.pedidos.filter(p => p.estado !== 'listo');
  const dias_ = {};
  pend.forEach(p => p.items.forEach(i => {
    const d = dias_[p.fecha] = dias_[p.fecha] || {};
    const k = (i.desc || '').trim().toLowerCase() + (i.pers ? '¶' + i.pers : '');
    d[k] = d[k] || { desc: i.desc, pers: i.pers, cant: 0, cods: [] };
    d[k].cant += i.cant; d[k].cods.push(p.codigo);
  }));
  const fechas = Object.keys(dias_).sort();
  $('resumen').innerHTML = fechas.length ? fechas.map(f => `<div class="dia"><h3>${fechaLarga(f)}</h3><table>${Object.values(dias_[f]).sort((a, b) => a.desc.localeCompare(b.desc)).map(x => `<tr><td class="n">${x.cant}</td><td>${esc(x.desc)}${x.pers ? `<br><small>✏️ ${esc(x.pers)}</small>` : ''}<br><small>${x.cods.join(', ')}</small></td></tr>`).join('')}</table></div>`).join('')
    : '<div class="vacio">No hay nada pendiente de producir en este rango.</div>';
}

function sonar() {
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.2, ctx.currentTime + t); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18); });
  } catch (e) {}
}

// ===== controles =====
$('rangos').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; st.rango = b.dataset.r; [...$('rangos').children].forEach(x => x.classList.toggle('activa', x === b)); cargar(); };
$('vistas').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; st.vista = b.dataset.v; [...$('vistas').children].forEach(x => x.classList.toggle('activa', x === b));
  $('tablero').classList.toggle('oculto', st.vista !== 'pedidos'); $('resumen').classList.toggle('oculto', st.vista !== 'resumen'); dibujar(); };
function aplicarZoom() { document.body.style.zoom = st.zoom; guardar('zoom', st.zoom); }
$('z-mas').onclick = () => { st.zoom = Math.min(2, Math.round((st.zoom + 0.1) * 10) / 10); aplicarZoom(); };
$('z-menos').onclick = () => { st.zoom = Math.max(0.7, Math.round((st.zoom - 0.1) * 10) / 10); aplicarZoom(); };
document.addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z) { $('visor-img').src = z.dataset.zoom; $('visor').classList.remove('oculto'); } });
$('visor').onclick = () => $('visor').classList.add('oculto');

function abrirApp() {
  vista('v-app'); $('usr').textContent = st.usuario?.nombre || ''; aplicarZoom();
  cargar();
  sb.channel('kadima-produccion')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_web' }, () => cargar())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_encargo' }, () => cargar())
    .subscribe(s => { $('vivo').textContent = s === 'SUBSCRIBED' ? '● en vivo' : '● reconectando'; });
  setInterval(cargar, 30000);
  setInterval(() => dibujar(), 60000);
}
iniciar();
</script>
