<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cierre de Stock - Resumen</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .meta { color: #555; margin-bottom: 20px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; font-size: 14px; text-align: left; }
  th { background: #7a1616; color: #fff; }
  td.num { text-align: right; }
  .pos { color: #157347; font-weight: bold; }
  .neg { color: #b02a2a; font-weight: bold; }
  .zero { color: #888; }
  button { margin-top: 20px; padding: 10px 18px; background: #7a1616; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  @media print { button { display: none; } }
</style>
</head>
<body>

<h1>Cierre de Stock</h1>
<div class="meta" id="meta"></div>
<table>
  <thead>
    <tr>
      <th>Producto</th>
      <th>Cant. sistema</th>
      <th>Cant. contada</th>
      <th>Unidad</th>
      <th>Diferencia</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody id="filas"></tbody>
</table>
<button onclick="window.print()">Imprimir / Guardar como PDF</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const almacen = params.get('almacen') || '';
  const fecha = params.get('fecha') || '';
  document.getElementById('meta').innerText = 'Almacén: ' + almacen + '   |   Fecha: ' + fecha;

  const data = JSON.parse(params.get('data') || '[]');
  const tbody = document.getElementById('filas');

  data.forEach(item => {
    const dif = item.Diferencia;
    const claseDif = dif > 0 ? 'pos' : (dif < 0 ? 'neg' : 'zero');
    const textoDif = dif > 0 ? ('+' + dif) : dif;

    const fila = document.createElement('tr');
    fila.innerHTML =
      '<td>' + item.ProductoTxt + '</td>' +
      '<td class="num">' + item.CantidadSistema + '</td>' +
      '<td class="num">' + item.CantidadContada + '</td>' +
      '<td>' + (item.UnidadTxt || '') + '</td>' +
      '<td class="num ' + claseDif + '">' + textoDif + '</td>' +
      '<td>' + item.Accion + '</td>';
    tbody.appendChild(fila);
  });
</script>

</body>
</html>
